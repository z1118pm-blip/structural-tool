<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>应力释放 · Structura Breakout</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;background:radial-gradient(circle at center, #0f172a 0%, #0b1120 100%);color:#f8fafc;overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;}
  /* 移除旧的 :root 魔法变量，采用完全自适应的 Flex 弹性布局 */
  #wrap{display:flex;flex-direction:column;height:100vh;height:100dvh;width:100%;align-items:center;justify-content:center;
    padding:8px;gap:8px;overflow:hidden;}
  #hudBar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:1100px;flex-shrink:0;
    font-family:"JetBrains Mono","SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    font-size:12px;color:#94a3b8;letter-spacing:.5px;}
  #hudBar .left{display:flex;gap:22px;flex-wrap:wrap;align-items:center;}
  #hudBar .item b{color:#94a3b8;font-size:11px;letter-spacing:1px;margin-right:5px;font-weight:600;}
  #hudBar .item i{font-style:normal;color:#38bdf8;font-weight:600;font-variant-numeric:tabular-nums;
    display:inline-block;text-shadow:0 0 10px rgba(56,189,248,.55);}
  #hudBar .item i.ok{color:#4ade80;text-shadow:0 0 10px rgba(74,222,128,.55);}
  #hudBar .right{display:flex;gap:8px;}
  .hudBtn{background:rgba(30,41,59,.4);border:1px solid #334155;color:#94a3b8;font-size:10px;
    padding:4px 10px;border-radius:5px;font-family:inherit;cursor:pointer;transition:all .18s;
    letter-spacing:.5px;}
  .hudBtn:hover{border-color:#38bdf8;color:#38bdf8;}
  .hudBtn.on{background:rgba(56,189,248,.10);border-color:#38bdf8;color:#38bdf8;}
  .hudVol{display:flex;align-items:center;gap:6px;}
  .hudVol .volLbl{font-size:9.5px;color:#64748b;letter-spacing:1px;font-weight:600;}
  .hudVol input[type=range]{width:60px;height:3px;-webkit-appearance:none;appearance:none;background:#1e293b;border-radius:2px;outline:none;cursor:pointer;}
  .hudVol input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:11px;height:11px;background:#38bdf8;border-radius:50%;box-shadow:0 0 8px rgba(56,189,248,.6);cursor:pointer;}
  .hudVol input[type=range]::-moz-range-thumb{width:11px;height:11px;background:#38bdf8;border-radius:50%;border:none;cursor:pointer;}
  .hudVol .volVal{font-size:10px;color:#38bdf8;min-width:24px;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;}

  #canvasRow{display:flex;gap:14px;align-items:stretch;justify-content:center;flex:1 1 auto;min-height:0;width:100%;max-width:1100px;}
  #canvasWrap{position:relative;flex:1 1 auto;width:100%;min-height:0;background:#050914;border:1px solid #334155;border-radius:12px;overflow:hidden;
    box-shadow:0 16px 48px rgba(0,0,0,.75), 0 0 0 1px rgba(56,189,248,.12) inset;touch-action:none;cursor:none;}
  #overlay.show{cursor:default;}
  #gcv{display:block;width:100%;height:100%;}
  
  #legend{flex:0 0 200px;display:flex;flex-direction:column;gap:6px;
    padding:12px 10px;background:rgba(15,23,42,.6);border:1px solid #334155;
    border-radius:12px;font-family:"JetBrains Mono",Menlo,Consolas,monospace;font-size:10.5px;
    color:#94a3b8;box-shadow:0 8px 24px rgba(0,0,0,.4);overflow-y:auto;backdrop-filter:blur(4px);}
  #legend .lgTitle{font-size:9.5px;letter-spacing:1.5px;color:#4ade80;font-weight:600;
    padding-bottom:5px;border-bottom:1px solid rgba(74,222,128,.25);margin-bottom:2px;}
  #legend .lgTitle.hazard{color:#f87171;border-bottom-color:rgba(248,113,113,.3);margin-top:8px;}
  #legend .lgItem{display:flex;align-items:center;gap:7px;line-height:1.35;}
  #legend .lgIcon{flex:0 0 auto;width:20px;height:20px;border-radius:4px;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    border:1.5px solid currentColor;background:rgba(255,255,255,.04);}
  #legend .lgText{flex:1;min-width:0;}
  #legend .lgText b{display:block;color:#cbd5e1;font-size:11px;font-weight:600;margin-bottom:1px;}
  #legend .lgText span{font-size:9px;color:#64748b;line-height:1.3;display:block;}

  #touchBar{display:none;gap:10px;width:100%;justify-content:center;flex-shrink:0;}
  #touchBar button{flex:1;max-width:240px;padding:14px 0;font-size:15px;font-weight:600;
    border-radius:10px;border:1px solid #1e293b;background:#0a1220;color:#94a3b8;
    font-family:inherit;cursor:pointer;touch-action:manipulation;transition:all .15s;
    letter-spacing:1px;}
  #touchBar button:active{background:#1e293b;border-color:#38bdf8;color:#38bdf8;
    box-shadow:0 0 18px rgba(56,189,248,.25);}

  #overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;background:rgba(4,7,15,.78);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .24s;z-index:5;padding:20px;text-align:center;}
  #overlay.show{opacity:1;pointer-events:auto;}
  #overlay h1{font-size:24px;color:#38bdf8;letter-spacing:6px;font-weight:700;
    font-family:"JetBrains Mono","SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    text-shadow:0 0 24px rgba(56,189,248,.6), 0 0 48px rgba(56,189,248,.3);}
  #overlay p{font-size:13px;color:#cbd5e1;line-height:1.8;}
  #overlay p.small{font-size:11px;color:#64748b;letter-spacing:.5px;}
  #overlay .big{font-size:38px;color:#f97316;font-weight:700;
    font-family:"JetBrains Mono","SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
    text-shadow:0 0 20px rgba(249,115,22,.6);letter-spacing:2px;}
  #overlay .hint{font-size:12px;color:#38bdf8;letter-spacing:1px;margin-top:6px;
    animation:pulseHint 1.6s ease-in-out infinite;}
  @keyframes pulseHint{0%,100%{opacity:.5;}50%{opacity:1;}}
  #overlay .layoutTag{display:inline-block;font-size:11px;color:#fbbf24;border:1px solid rgba(251,191,36,.4);
    padding:2px 10px;border-radius:4px;background:rgba(251,191,36,.08);letter-spacing:1px;
    font-family:"JetBrains Mono",Menlo,monospace;margin-top:4px;}
  
  /* ===== 移动端通用适配（横竖屏统一弹性） ===== */
  @media (max-width:1000px) {
    #wrap{padding:6px;gap:6px;}
    #hudBar{font-size:11px;}
    #hudBar .left{gap:8px;}
    #hudBar .right{gap:4px;}
    #hudBar .hudVol {display:none;} /* 隐藏音量条 */
    #btnLegend{padding:4px 6px;font-size:11px;letter-spacing:0;}
    .hudBtn{padding:4px 8px;font-size:11px;}
    
    #canvasRow{flex-direction:column;gap:6px;}
    #legend:not(.show){display:none!important;}
    #legend.show{
      display:flex;position:fixed;
      top:50%;left:50%;transform:translate(-50%,-50%);
      width:min(340px,92vw);max-height:72vh;
      flex-direction:column;gap:6px;
      padding:14px;z-index:200;overflow-y:auto;
      background:rgba(15,23,42,.97);backdrop-filter:blur(8px);
      border:1px solid #334155;border-radius:14px;
      box-shadow:0 20px 60px rgba(0,0,0,.85);
    }
    #legend .lgItem{flex:0 0 auto;min-width:0;}
    
    #touchBar{display:flex;gap:8px;width:100%;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,4px);}
    #touchBar button{flex:1;padding:12px 0;font-size:14px;background:rgba(10,18,32,0.85);border:1px solid #1e293b;color:#cbd5e1;border-radius:8px;font-family:inherit;cursor:pointer;touch-action:manipulation;letter-spacing:1px;}
    #touchBar button:active{background:#1e293b;border-color:#38bdf8;color:#38bdf8;box-shadow:0 0 18px rgba(56,189,248,.25);}
  }

  /* ===== 横屏特别处理（小高度设备） ===== */
  @media (orientation:landscape) and (max-height:560px) {
    #wrap{padding:4px;gap:4px;}
    #hudBar{font-size:10px;}
    #canvasRow{flex-direction:row;gap:8px;}
    #touchBar{flex-direction:row;width:100%;}
    #touchBar button{padding:8px 0;font-size:12px;}
  }

  /* ===== 最后一球警告 & 连击 HUD & 返回按钮 ===== */
  @keyframes pulseRed {
    0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7), 0 16px 48px rgba(0,0,0,.75); }
    70% { box-shadow: 0 0 0 10px rgba(239,68,68,0), 0 16px 48px rgba(0,0,0,.75); }
    100% { box-shadow: 0 0 0 0 rgba(239,68,68,0), 0 16px 48px rgba(0,0,0,.75); }
  }
  #canvasWrap.last-life { animation: pulseRed 1.5s infinite; border-color: rgba(239,68,68,0.6); }
  
  #comboHud {
    position:absolute; top:15px; left:50%; transform:translateX(-50%);
    font-family:"JetBrains Mono",monospace; font-size:16px; font-weight:bold;
    color:#38bdf8; text-shadow:0 0 12px #38bdf8, 0 2px 4px #000;
    opacity:0; transition:opacity 0.3s, transform 0.1s; pointer-events:none; z-index:4;
  }
  #comboHud.show { opacity:1; }
  #comboHud.bump { transform:translateX(-50%) scale(1.2); color:#fde68a; text-shadow:0 0 20px #fde68a, 0 2px 4px #000; }

  .overlayBtn {
    display:inline-block; margin-top:12px; padding:8px 20px;
    background:rgba(56,189,248,.1); border:1px solid #38bdf8; color:#38bdf8;
    border-radius:6px; text-decoration:none; font-size:13px; font-weight:bold;
    transition:all 0.2s; cursor:pointer;
  }
  .overlayBtn:hover { background:rgba(56,189,248,.25); box-shadow:0 0 15px rgba(56,189,248,.4); }
  .overlayBtn.danger { border-color:#f43f5e; color:#fb7185; background:rgba(244,63,94,.1); }
  .overlayBtn.danger:hover { background:rgba(244,63,94,.25); box-shadow:0 0 15px rgba(244,63,94,.4); }

  /* 赛博旁白 */
  #tauntText {
    position:absolute; bottom:22%; left:50%; transform:translate(-50%, 10px);
    font-family:"JetBrains Mono",monospace; font-size:18px; font-weight:bold;
    color:#a78bfa; text-shadow:0 0 10px #a78bfa, 0 2px 4px #000;
    opacity:0; transition:all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    pointer-events:none; z-index:10; letter-spacing:2px;
    white-space:normal; text-align:center; max-width:90%;
  }
  #tauntText.show { opacity:1; transform:translate(-50%, 0); }

  /* ===== 图例折叠 + 长按防护（所有尺寸通用）===== */
  #legend:not(.show){display:none!important;}
  #canvasWrap{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
</style>
</head>
<body>
<div id="wrap">
  <div id="hudBar">
    <div class="left">
      <span class="item"><b>得分</b><i id="hudScore">0</i></span>
      <span class="item"><b>关卡</b><i id="hudLevel">1</i></span>
      <span class="item"><b>生命</b><i id="hudLives">3</i></span>
      <span class="item"><b>峰值</b><i id="hudBest">0</i></span>
    </div>
    <div class="right">
      <div class="hudVol">
        <span class="volLbl">VOL</span>
        <input type="range" id="volRange" min="0" max="100" step="5" value="35">
        <span class="volVal" id="volVal">35</span>
      </div>
      <button class="hudBtn on" id="btnMusic" type="button">🎵 音乐</button>
      <button class="hudBtn on" id="btnSound" type="button">🔊 音效</button>
      <button class="hudBtn" id="btnLegend" type="button" title="道具图例">📖</button>
      <button class="hudBtn" id="btnFull" type="button" title="全屏">⛶</button>
    </div>
  </div>
  <div id="canvasRow">
    <div id="canvasWrap">
      <canvas id="gcv"></canvas>
      <div id="comboHud">COMBO × <span id="comboNum">0</span></div>
      <div id="tauntText"></div>
      <div id="overlay"></div>
    </div>
    <div id="legend" class="show"></div>
  </div>
  <div id="touchBar">
    <button id="btnLeft" type="button">◀</button>
    <button id="btnLaunch" type="button">发射</button>
    <button id="btnPause" type="button">暂停</button>
    <button id="btnRight" type="button">▶</button>
  </div>
</div>

<!-- 背景音乐（同目录下的两个 mp3，每局随机切一首） -->
<audio id="bgmA" src="bgm1.mp3" loop preload="auto"></audio>
<audio id="bgmB" src="bgm.mp3" loop preload="auto"></audio>

<script>
(function(){
  'use strict';

  /* ===================== 常量（改为动态以适应屏幕） ===================== */
  let W = 800, H = 600;
  let WALL = 20;
  let PADDLE_W = 110, PADDLE_H = 14;
  let PADDLE_Y = H - 50;
  let BALL_R = 8; 
  let BASE_SPEED = 380;
  let PADDLE_SPEED = 720;
  const MAX_BOUNCE_ANGLE = Math.PI / 3;
  const MIN_VY_RATIO = Math.sin(Math.PI / 12);

  let BRICK_COLS = 10;
  let BRICK_MARGIN_X = 40;
  let BRICK_MARGIN_TOP = 90;
  let BRICK_H = 24, BRICK_GAP = 8;
  let BRICK_W = 0;

  const BRICK_COLORS = ['#f97316', '#a855f7', '#22d3ee', '#10b981', '#fde68a'];
  /* 随机图案库（24 种）。每关从 PATTERNS 抽取一个图案，
     并排除最近 5 关用过的图案，配合 4~7 行随机 + 3 种颜色方案，
     30 次内不会重复。图案函数签名统一：
     (row, col, rows, cols, rnd, cache) => boolean */
  const PATTERNS = [
    { name: '满铺',     fn: () => true },
    { name: '棋盘',     fn: (r, c) => (r + c) % 2 === 0 },
    { name: '稀疏',     fn: (r, c, R, C, rnd) => rnd() > 0.4 },
    { name: '双槽',     fn: (r, c, R, C) => c >= 2 && c <= C - 3 },
    { name: '中槽',     fn: (r, c, R, C) => Math.abs(c - (C - 1) / 2) > 1 },
    { name: '金字塔',   fn: (r, c, R, C) => {
        const half = Math.floor((C - 1) / 2);
        const m = Math.max(0, half - r);
        return c >= m && c <= C - 1 - m;
      } },
    { name: '倒金字塔', fn: (r, c, R, C) => {
        const half = Math.floor((C - 1) / 2);
        const m = Math.max(0, half - (R - 1 - r));
        return c >= m && c <= C - 1 - m;
      } },
    { name: '菱形',     fn: (r, c, R, C) => {
        const dr = Math.abs(r - (R - 1) / 2);
        const dc = Math.abs(c - (C - 1) / 2);
        return (dr / Math.max(1, (R - 1) / 2)) + (dc / Math.max(1, (C - 1) / 2)) <= 1.05;
      } },
    { name: '十字',     fn: (r, c, R, C) => {
        const mr = Math.floor((R - 1) / 2), mc = Math.floor((C - 1) / 2);
        return r === mr || r === mr - 1 || c === mc;
      } },
    { name: '边框',     fn: (r, c, R, C) => r === 0 || r === R - 1 || c === 0 || c === C - 1 },
    { name: '斜纹 /',   fn: (r, c) => (r + c) % 3 !== 0 },
    { name: '斜纹 \\',  fn: (r, c) => (r - c + 30) % 3 !== 0 },
    { name: '波浪',     fn: (r, c) => Math.round(Math.sin(c * 0.8) * 1.5 + r - 1) >= 0 },
    { name: '随机缺口', fn: (r, c, R, C, rnd) => rnd() > 0.2 },
    { name: '左右对称', fn: (r, c, R, C, rnd, cache) => {
        const k = r + '_' + Math.min(c, C - 1 - c);
        if(cache[k] == null) cache[k] = rnd() > 0.3;
        return cache[k];
      } },
    { name: '上下对称', fn: (r, c, R, C, rnd, cache) => {
        const k = Math.min(r, R - 1 - r) + '_' + c;
        if(cache[k] == null) cache[k] = rnd() > 0.35;
        return cache[k];
      } },
    { name: '竖条纹',   fn: (r, c) => c % 2 === 0 || c % 3 === 0 },
    { name: '横条纹',   fn: (r, c, R) => r % 2 === 0 || r === R - 1 },
    { name: '同心框',   fn: (r, c, R, C) => {
        const rr = Math.min(r, R - 1 - r), cc = Math.min(c, C - 1 - c);
        return Math.min(rr, cc) % 2 === 0;
      } },
    { name: '四角',     fn: (r, c, R, C) => {
        const dr = Math.min(r, R - 1 - r), dc = Math.min(c, C - 1 - c);
        return dr + dc <= 1;
      } },
    { name: '中空十字', fn: (r, c, R, C) => {
        const mr = Math.floor((R - 1) / 2), mc = Math.floor((C - 1) / 2);
        const onEdge = r === 0 || r === R - 1 || c === 0 || c === C - 1;
        const onCross = r === mr || c === mc;
        return onEdge || onCross;
      } },
    { name: '锯齿',     fn: (r, c) => (c + (r % 2)) % 2 === 0 || r % 3 === 0 },
    { name: '间隔满铺', fn: (r, c) => r % 2 === 0 || c % 2 === 0 },
    { name: '交错棋盘', fn: (r, c) => (Math.floor(r / 2) + c) % 2 === 0 }
  ];

  /* ===================== DOM ===================== */
  const canvas     = document.getElementById('gcv');
  const canvasWrap = document.getElementById('canvasWrap');
  const ctx        = canvas.getContext('2d');
  const hudScore   = document.getElementById('hudScore');
  const hudLevel   = document.getElementById('hudLevel');
  const hudLives   = document.getElementById('hudLives');
  const hudBest    = document.getElementById('hudBest');
  const overlay    = document.getElementById('overlay');
  const btnMusic   = document.getElementById('btnMusic');
  const btnSound   = document.getElementById('btnSound');
  const btnLaunch  = document.getElementById('btnLaunch');
  const btnPause   = document.getElementById('btnPause');
  const bgmA       = document.getElementById('bgmA');
  const bgmB       = document.getElementById('bgmB');
  const volRange   = document.getElementById('volRange');
  const volVal     = document.getElementById('volVal');
  const tauntEl    = document.getElementById('tauntText');

  /* 画布左下角激活效果展示顺序（单一来源，新增道具时只改这里） */
  const EFFECT_ORDER = ['laser', 'slowBall', 'fastBall', 'paddleWide', 'paddleNarrow', 'darkVision', 'catch', 'pierce', 'bigBall', 'miniBall'];

  /* 触屏设备缓存（用于 held 状态提示文案） */
  const IS_COARSE = !!(window.matchMedia && window.matchMedia('(pointer:coarse)').matches);

  /* ===================== 状态 ===================== */
  /* 本局最高分：纯内存变量，刷新即清零（不做保存系统） */
  let sessionBest = 0;

  const G = {
    state: 'ready',
    score: 0, level: 1, lives: 3,
    bricks: [], particles: [], rings: [], floaters: [], trail: [],
    paddle: { x: W / 2, targetX: W / 2, control: 'pointer', squash: 0, w: PADDLE_W },
    ball:   { x: W / 2, y: PADDLE_Y - BALL_R - 2, vx: 0, vy: 0, stuck: true, held: false },
    extraBalls: [],
    powerups: [],
    bullets: [],
    effects: { paddleWide: 0, paddleNarrow: 0, slowBall: 0, fastBall: 0, laser: 0, darkVision: 0, catch: 0, pierce: 0, bigBall: 0, miniBall: 0 },
    laserCooldown: 0,
    keys: {},
    combo: 0,
    shake: 0,
    stuckSamples: [],
    soundOn: true,
    musicOn: true,
    volume: 35,        /* 0~100，同时作用于 BGM 与 SFX */
    stars: [],
    layoutName: '满铺',
    overTimer: null,
    maxCombo: 0,
    brokenCount: 0,
    powerupsCollected: 0
  };
  const comboHudEl = document.getElementById('comboHud');
  const comboNumEl = document.getElementById('comboNum');

  /* ===================== 赛博旁白台词库 ===================== */
  const TAUNTS = {
    combo: [
      '噢哟，你好凶哦！',
      '手速不错嘛，继续保持。',
      '这波连击有点东西。',
      '挡板都跟不上你的节奏了。',
      '再猛一点，砖块顶不住了。'
    ],
    lose: [
      '球掉了，人也掉了。',
      '这球我帮你接不住。',
      '再来一次吧，别气馁。',
      '手滑？还是心滑？'
    ],
    lowLife: [
      '只剩一条命了，稳住。',
      '深呼吸，手别抖。',
      '最后一条命，拿出真本事。'
    ],
    bad: [
      '啊，吃了个坏的。',
      '运气不太好呢。',
      '这就是贪吃的代价。',
      '这口吃得不太划算。'
    ],
    hard: [
      '三血硬砖，被你磨穿了。',
      '这砖有点硬，不过你更硬。',
      '装甲都挡不住你。'
    ],
    boss: [
      '你看看你后面是哪个？',
      '领导在你后面看你耍。',
      '摸鱼可以，别被看见。',
      '工位摄像头还亮着呢。',
      '这局打完记得切回工作。'
    ]
  };

  /* 台词去重：每种类型独立记录最近用过的索引，短时间不重复同一句。
     规则：最近 2 条不重复（池子只有 3 条时相当于「不连续重复」）。
     跨 resetGame 保留，重开一局也不会马上蹦出刚喊过的句子。 */
  const TAUNT_RECENT = {};
  const TAUNT_RECENT_MAX = 2;
  function pickTaunt(type){
    const arr = TAUNTS[type];
    if(!arr || arr.length === 0) return null;
    if(arr.length === 1) return arr[0];
    const recent = TAUNT_RECENT[type] || [];
    const pool = [];
    for(let i = 0; i < arr.length; i++){
      if(!recent.includes(i)) pool.push(i);
    }
    const idx = pool[Math.floor(Math.random() * pool.length)];
    recent.push(idx);
    const cap = Math.min(TAUNT_RECENT_MAX, arr.length - 1);
    while(recent.length > cap) recent.shift();
    TAUNT_RECENT[type] = recent;
    return arr[idx];
  }

  /* ===================== 音频 ===================== */
  let audioCtx = null;
  function ensureAudio(){
    if(audioCtx) return audioCtx;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; }
    return audioCtx;
  }
  function tone(freq, dur, type, vol){
    if(!G.soundOn) return;
    const ac = ensureAudio();
    if(!ac) return;
    try {
      if(ac.state === 'suspended') ac.resume();
      const osc = ac.createOscillator();
      const g = ac.createGain();
      osc.type = type || 'sine';
      osc.frequency.setValueAtTime(freq, ac.currentTime);
      const scale = G.volume / 35;   /* 35 为基准，滑到 100 音量约 3 倍，0 则静音 */
      /* exponentialRamp 起始值不能为 0（Web Audio 未定义行为），
         音量滑到 0 时用 0.0001 兜底，听感仍是静音 */
      const startGain = Math.max(0.0001, (vol || 0.045) * scale);
      g.gain.setValueAtTime(startGain, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
      osc.connect(g);
      g.connect(ac.destination);
      osc.start();
      osc.stop(ac.currentTime + dur + 0.02);
    } catch(e){}
  }
  function sfxWall(){ tone(180, 0.05, 'sine', 0.035); }
  function sfxPaddle(){ tone(320, 0.06, 'triangle', 0.05); }
  function sfxBrick(row, combo){
    /* rows 最多 14，row=13 时 380+(4-13)*65 为负；
       Web Audio 负频率会抛异常，被 tone() 的 try/catch 静默吞掉，表现为音效消失 */
    const baseFreq = Math.max(120, 380 + (4 - row) * 65);
    const comboShift = Math.min((combo || 0) * 10, 400); // 连击越高，音调越高，封顶400
    tone(baseFreq + comboShift, 0.045, 'square', 0.03);
  }
  function sfxLose(){ tone(220, 0.32, 'sawtooth', 0.07); }
  function sfxClear(){
    tone(523, 0.08, 'sine', 0.06);
    setTimeout(()=>tone(659, 0.08, 'sine', 0.06), 80);
    setTimeout(()=>tone(784, 0.14, 'sine', 0.06), 160);
  }
  function sfxPowerup(){
    tone(880, 0.06, 'sine', 0.06);
    setTimeout(()=>tone(1100, 0.08, 'sine', 0.05), 60);
  }

  /* ===================== 背景音乐 ===================== */
  /* 打开页面后，首次用户交互即开始播放；之后跨所有游戏状态（ready/playing/paused/over/cleared）
     持续播放，不因死亡 / 暂停 / 通关而中断。只有 musicOn 按钮关闭时才暂停。
     每局 resetGame 换另一首从头播（换歌不算中断）。
     音量由 G.volume 统一控制（同时影响 SFX）。 */
  let currentBgm = null;
  let bgmStarted = false;

  function applyVolume(){
    /* BGM 上限 0.85（避免 slider 100 太炸）；SFX 由 tone() 里 35 基准缩放 */
    const v = (G.volume / 100) * 0.85;
    if(bgmA) bgmA.volume = v;
    if(bgmB) bgmB.volume = v;
    if(volVal) volVal.textContent = G.volume;
    if(volRange && parseFloat(volRange.value) !== G.volume){
      volRange.value = G.volume;
    }
  }

  function pickBgm(){
    if(currentBgm === bgmA) return bgmB;
    if(currentBgm === bgmB) return bgmA;
    return Math.random() < 0.5 ? bgmA : bgmB;
  }

  function startBgm(restart){
    /* restart=true 从头播；false 从当前位置继续 */
    if(!G.musicOn) return;
    if(!bgmA && !bgmB) return;
    if(!currentBgm) currentBgm = pickBgm();
    if(!currentBgm) return;
    /* 另一首若在播则暂停 */
    if(currentBgm === bgmA && bgmB && !bgmB.paused) bgmB.pause();
    if(currentBgm === bgmB && bgmA && !bgmA.paused) bgmA.pause();
    try {
      if(restart) currentBgm.currentTime = 0;
    } catch(e){}
    const p = currentBgm.play();
    if(p && p.then){
      p.then(()=>{ bgmStarted = true; }).catch(()=>{});
    } else {
      bgmStarted = true;
    }
  }

  function switchBgm(){
    /* 换另一首从头播（新一局开始）。musicOn 关闭时只换不播，等用户开音乐再起。 */
    const next = pickBgm();
    if(currentBgm && currentBgm !== next){
      try { currentBgm.pause(); currentBgm.currentTime = 0; } catch(e){}
    }
    currentBgm = next;
    if(G.musicOn){
      startBgm(true);
    }
  }

  function pauseBgm(){
    if(currentBgm){
      try { currentBgm.pause(); } catch(e){}
    }
  }

  /* ===================== 画布 & 背景预渲染 ===================== */
  let dpr = 1, cw = W, ch = H;
  let bgCanvas = null, bgCtx = null;

  function buildStars(){
    G.stars = [];
    for(let i = 0; i < 90; i++){
      G.stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.4 + Math.random() * 1.4,
        a: 0.15 + Math.random() * 0.5,
        sp: 3 + Math.random() * 10,
        tw: Math.random() * Math.PI * 2
      });
    }
  }

  function prerenderBackground(){
    if(!bgCanvas){
      bgCanvas = document.createElement('canvas');
      bgCtx = bgCanvas.getContext('2d');
    }
    bgCanvas.width  = Math.round(cw * dpr);
    bgCanvas.height = Math.round(ch * dpr);
    const g = bgCtx;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const sx = cw / W, sy = ch / H;

    const bg = g.createLinearGradient(0, 0, 0, ch);
    bg.addColorStop(0, '#0d1526');
    bg.addColorStop(0.5, '#09101e');
    bg.addColorStop(1, '#050914');
    g.fillStyle = bg;
    g.fillRect(0, 0, cw, ch);

    g.save();
    g.globalCompositeOperation = 'lighter';
    const nebulae = [
      { x: 0.22, y: 0.28, r: 0.45, c: 'rgba(56,189,248,0.08)' },
      { x: 0.78, y: 0.68, r: 0.40, c: 'rgba(168,85,247,0.06)' },
      { x: 0.50, y: 0.90, r: 0.35, c: 'rgba(34,211,238,0.05)' }
    ];
    for(const n of nebulae){
      const rg = g.createRadialGradient(n.x * cw, n.y * ch, 0, n.x * cw, n.y * ch, n.r * Math.max(cw, ch));
      rg.addColorStop(0, n.c);
      rg.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = rg;
      g.fillRect(0, 0, cw, ch);
    }
    g.restore();

    g.save();
    const gridStep = 32 * sx;
    g.lineWidth = 1;
    for(let x = 0; x <= cw; x += gridStep){
      const grad = g.createLinearGradient(0, 0, 0, ch);
      grad.addColorStop(0, 'rgba(56,189,248,0.03)');
      grad.addColorStop(0.5, 'rgba(56,189,248,0.08)');
      grad.addColorStop(1, 'rgba(56,189,248,0.04)');
      g.strokeStyle = grad;
      g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, ch); g.stroke();
    }
    for(let y = 0; y <= ch; y += gridStep * sy){
      const grad = g.createLinearGradient(0, 0, cw, 0);
      grad.addColorStop(0, 'rgba(56,189,248,0.03)');
      grad.addColorStop(0.5, 'rgba(56,189,248,0.08)');
      grad.addColorStop(1, 'rgba(56,189,248,0.04)');
      g.strokeStyle = grad;
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(cw, y + 0.5); g.stroke();
    }
    g.restore();
  }

  function resizeCanvas(){
    const rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    const isMobile = window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 1000;
    dpr = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    cw = Math.max(1, rect.width);
    ch = Math.max(1, rect.height);
    canvas.width  = Math.round(cw * dpr);
    canvas.height = Math.round(ch * dpr);
    
    const oldW = W, oldH = H;
    const aspect = cw / ch;
    const baseArea = 480000; // 800 * 600 的基准面积
    W = Math.sqrt(baseArea * aspect);
    H = Math.sqrt(baseArea / aspect);
    
    const s = W / 800;
    WALL = 20 * s;
    PADDLE_W = 110 * s;
    PADDLE_H = 14 * s;
    PADDLE_Y = H - 50 * s;
    BASE_SPEED = 380 * s;
    PADDLE_SPEED = 720 * s;
    BRICK_MARGIN_X = Math.max(WALL + 2, 40 * s);
    BRICK_MARGIN_TOP = 90 * s;
    BRICK_H = 24 * s;
    BRICK_GAP = 8 * s;
    /* 极端窄屏下加下限保护，避免 BRICK_W 为负导致砖块重叠 */
    BRICK_W = Math.max(6 * s, (W - BRICK_MARGIN_X * 2 - BRICK_GAP * (BRICK_COLS - 1)) / BRICK_COLS);
    
    // 如果宽高发生改变，无缝按比例迁移当前物体位置
    if (oldW > 0 && oldH > 0 && (oldW !== W || oldH !== H)) {
      const sx = W / oldW, sy = H / oldH;
      /* 先按新尺寸更新球半径，后续 clamp 才能用正确的 BALL_R */
      updateBallRadius();

      /* 砖块：位置按 sx/sy 缩放，宽高统一取新的全局 BRICK_W/BRICK_H。
         砖块尺寸只随宽度缩放（BRICK_H = 24 * W/800），不能按 sy 拉伸，
         否则 sx !== sy 时砖块会被非等比扭曲。 */
      for (const b of G.bricks) {
        b.x *= sx; b.y *= sy;
        b.w = BRICK_W; b.h = BRICK_H;
      }

      /* 球：位置按 sx/sy 缩放；速度大小按宽度比例 sx 统一缩放，保持方向不变，
         避免 sx !== sy 时合速度被扭曲。随后做边界与挡板位置钳制。 */
      const speedScale = sx;
      const clampBall = (b) => {
        if (!b) return;
        if (b.x < WALL + BALL_R) b.x = WALL + BALL_R;
        if (b.x > W - WALL - BALL_R) b.x = W - WALL - BALL_R;
        if (b.y < WALL + BALL_R) b.y = WALL + BALL_R;
        /* 球落到挡板下方时抬回挡板上方，防止 resize 后直接判负 */
        if (b.y + BALL_R > PADDLE_Y + PADDLE_H) b.y = PADDLE_Y - BALL_R - 2;
      };
      /* resize 后球速钳制：避免拉宽窗口后球速超过发射路径的 950 硬上限，
         或缩窄后趋近 0 */
      const clampSpeed = (b) => {
        const sp = Math.hypot(b.vx, b.vy);
        if (sp < 1e-6) return;
        const capped = Math.min(950, Math.max(BASE_SPEED * 0.35, sp));
        if (Math.abs(capped - sp) > 1e-6) {
          b.vx *= capped / sp; b.vy *= capped / sp;
        }
      };
      if (G.ball) {
        G.ball.x *= sx; G.ball.y *= sy;
        if (!G.ball.stuck && !G.ball.held) {
          G.ball.vx *= speedScale; G.ball.vy *= speedScale;
          clampSpeed(G.ball);
        }
        clampBall(G.ball);
      }
      for (const b of G.extraBalls) {
        b.x *= sx; b.y *= sy;
        b.vx *= speedScale; b.vy *= speedScale;
        clampSpeed(b);
        clampBall(b);
      }
      /* 挡板宽度跟随新的 PADDLE_W 重算，paused 状态下也能正确显示 */
      updatePaddleWidth();
      if (G.paddle) {
        G.paddle.x *= sx; G.paddle.targetX *= sx;
        const half = G.paddle.w / 2;
        G.paddle.x = Math.max(half + WALL, Math.min(W - half - WALL, G.paddle.x));
        G.paddle.targetX = Math.max(half + WALL, Math.min(W - half - WALL, G.paddle.targetX));
      }
      for (const pu of G.powerups) { pu.x *= sx; pu.y *= sy; }
      for (const bu of G.bullets) {
        bu.x *= sx; bu.y *= sy;
        bu.vy *= speedScale;
      }
      G.particles = []; G.rings = []; G.floaters = []; G.trail = [];
    }
    
    prerenderBackground();

    /* resize 后所有依赖尺寸的渐变/光晕缓存失效，否则砖块、挡板、
       暗角会保留旧尺寸的渐变，出现拉伸错位 */
    _wallGradCache = null;
    _centerGlowCache = null;
    _vignetteCache = null;
    brickGradCache.clear();
    Object.keys(_paddleGradCache).forEach(k => delete _paddleGradCache[k]);
  }

  function fromScreen(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return [
      (clientX - rect.left) / rect.width  * W,
      (clientY - rect.top)  / rect.height * H
    ];
  }

  /* ===================== HUD ===================== */
  function bumpHud(el){
    if(el._bumping) return;
    el._bumping = true;
    el.style.transition = 'none';
    el.style.transform = 'scale(1.28)';
    el.style.color = '#fef3c7';
    el.style.textShadow = '0 0 16px rgba(254,243,199,.8)';
    requestAnimationFrame(()=>{
      el.style.transition = 'transform .32s cubic-bezier(.2,.8,.2,1), color .32s, text-shadow .32s';
      el.style.transform = 'scale(1)';
      el.style.color = '';
      el.style.textShadow = '';
      setTimeout(() => { el._bumping = false; }, 360);
    });
  }

  function updateHUD(bump){
    if(hudScore.textContent != G.score) hudScore.textContent = G.score;
    if(hudLevel.textContent != G.level) hudLevel.textContent = G.level;
    if(hudLives.textContent != G.lives) hudLives.textContent = G.lives;
    if(hudBest.textContent != sessionBest) hudBest.textContent = sessionBest;
    hudLives.classList.toggle('ok', G.lives > 1);
    if(bump === 'score') bumpHud(hudScore);
    if(bump === 'level') bumpHud(hudLevel);
    if(bump === 'life')  bumpHud(hudLives);
    if(bump === 'best')  bumpHud(hudBest);
  }

  function recordPeak(){
    if(G.score > sessionBest){
      sessionBest = G.score;
      updateHUD('best');
    }
  }

  /* ===================== 覆盖层 ===================== */
  function showOverlay(titleHtml, lines, big){
    overlay.innerHTML = '';
    const h = document.createElement('h1');
    h.innerHTML = titleHtml;
    overlay.appendChild(h);
    if(big){
      const b = document.createElement('div');
      b.className = 'big';
      b.textContent = big;
      overlay.appendChild(b);
    }
    for(const l of lines){
      const p = document.createElement('p');
      if(l.small) p.className = 'small';
      p.textContent = l.text || l;
      overlay.appendChild(p);
    }
    overlay.classList.add('show');
  }
  function hideOverlay(){ overlay.classList.remove('show'); }

  function addLayoutTag(){
    const tag = document.createElement('div');
    tag.className = 'layoutTag';
    tag.textContent = '◈ 本关布局：' + G.layoutName;
    overlay.appendChild(tag);
  }

  function setState(s){
    G.state = s;
    if(G.overTimer){ clearTimeout(G.overTimer); G.overTimer = null; }

    if(s === 'ready'){
      showOverlay('应力释放', [
        { text: '按 空格 / 点击画布 / 发射按钮 发射', small: false },
        { text: '← → 或 A D 移动 · 鼠标/手指可拖动 · ESC 暂停 · R 重开', small: true },
        { text: '打碎砖块有概率掉落道具，接住即可触发', small: true }
      ]);
      addLayoutTag();
      /* 竖屏提示横屏 */
      if(window.matchMedia('(orientation:portrait) and (max-width:1000px)').matches){
        const rot = document.createElement('p');
        rot.className = 'small';
        rot.style.color = '#fbbf24';
        rot.textContent = '📱 建议横屏游玩，视野更大';
        overlay.appendChild(rot);
      }
      const hint = document.createElement('p');
      hint.className = 'hint';
      hint.textContent = '▸ 点击或按空格开始 ◂';
      overlay.appendChild(hint);
    } else if(s === 'playing'){
      hideOverlay();
    } else if(s === 'paused'){
      showOverlay('已暂停', [
        { text: '按 ESC / P / 继续按钮 恢复', small: false }
      ]);
      const btnWrap = document.createElement('div');
      const resumeBtn = document.createElement('button');
      resumeBtn.className = 'overlayBtn';
      resumeBtn.textContent = '▶ 继续';
      resumeBtn.addEventListener('click', () => { const b = document.getElementById('btnLaunch'); if(b) b.click(); });
      const reloadBtn = document.createElement('button');
      reloadBtn.className = 'overlayBtn danger';
      reloadBtn.textContent = '↻ 重开';
      reloadBtn.addEventListener('click', () => location.reload());
      const backLink = document.createElement('a');
      backLink.href = 'index.html';
      backLink.className = 'overlayBtn';
      backLink.textContent = '← 返回工具';
      btnWrap.appendChild(resumeBtn);
      btnWrap.appendChild(reloadBtn);
      btnWrap.appendChild(backLink);
      overlay.appendChild(btnWrap);
    } else if(s === 'over'){
      showOverlay('结构失效', [
        { text: '本局得分', small: true }
      ], G.score);
      const stats = document.createElement('p');
      stats.className = 'small';
      stats.innerHTML = `击碎砖块: ${G.brokenCount} · 最高连击: ${G.maxCombo} · 到达关卡: ${G.level} · 收集道具: ${G.powerupsCollected}`;
      overlay.appendChild(stats);
      
      const btnWrap = document.createElement('div');
      const againBtn = document.createElement('button');
      againBtn.className = 'overlayBtn danger';
      againBtn.textContent = '↻ 再来一局';
      againBtn.addEventListener('click', () => location.reload());
      const backLink = document.createElement('a');
      backLink.href = 'index.html';
      backLink.className = 'overlayBtn';
      backLink.textContent = '← 返回工具';
      btnWrap.appendChild(againBtn);
      btnWrap.appendChild(backLink);
      overlay.appendChild(btnWrap);
    }
    /* 控制最后一球警告 */
    const wrapEl = document.getElementById('canvasWrap');
    if(wrapEl) wrapEl.classList.toggle('last-life', G.lives === 1 && (s === 'ready' || s === 'playing'));
  }

  /* ===================== 砖块（随机布局） ===================== */
  function buildBricks(){
    const cols = BRICK_COLS;
    const rnd = Math.random;
    /* 行数与顶部留白自适应：
       - 先按全局 BRICK_MARGIN_TOP 计算可放行数；
       - 若连 5 行都放不下（超宽横屏/矮窗口），逐步压缩顶部 margin，
         而不是把 rows 硬拉到 5 导致砖块压到挡板甚至溢出画布；
       - 最终 rows 下限 2 行，上限 14 行。 */
    const s = W / 800;
    const bottomReserve = 150 * s;
    const rowUnit = BRICK_H + BRICK_GAP;
    let marginTop = BRICK_MARGIN_TOP;
    let availH = H - marginTop - bottomReserve;
    let maxRows = Math.floor(availH / rowUnit);
    if (maxRows < 5) {
      const minMargin = WALL + 8 * s;
      const need = (5 - maxRows) * rowUnit;
      marginTop = Math.max(minMargin, marginTop - need);
      availH = H - marginTop - bottomReserve;
      maxRows = Math.floor(availH / rowUnit);
    }
    const rows = Math.max(2, Math.min(14, maxRows));

    /* 排除最近 5 关用过的图案；全用完则清空记忆 */
    if(!G.recentPatterns) G.recentPatterns = [];
    let avail = [];
    for(let i = 0; i < PATTERNS.length; i++){
      if(!G.recentPatterns.includes(i)) avail.push(i);
    }
    if(avail.length === 0){
      avail = PATTERNS.map(function(_, i){ return i; });
      G.recentPatterns = [];
    }

    /* 循环重试，避免递归污染 recentPatterns；成功后一次性提交 */
    let pid, bricks, attempts = 0;
    do {
      attempts++;
      pid = avail[Math.floor(Math.random() * avail.length)];
      const patternFn = PATTERNS[pid].fn;
      const colorScheme = Math.floor(Math.random() * 3);
      const cache = {};
      bricks = [];
      for(let r = 0; r < rows; r++){
        for(let c = 0; c < cols; c++){
          if(!patternFn(r, c, rows, cols, rnd, cache)) continue;
          let color;
          if(colorScheme === 0)      color = BRICK_COLORS[r % BRICK_COLORS.length];
          else if(colorScheme === 1) color = BRICK_COLORS[Math.floor(Math.random() * BRICK_COLORS.length)];
          else                       color = BRICK_COLORS[c % BRICK_COLORS.length];

          /* 耐久砖：2 击 22%，3 击 6%，其余 1 击 */
          const roll = Math.random();
          let hp = 1;
          if(roll < 0.06) hp = 3;
          else if(roll < 0.28) hp = 2;

          bricks.push({
            x: BRICK_MARGIN_X + c * (BRICK_W + BRICK_GAP),
            y: marginTop + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H,
            color: color,
            score: (rows - r) * 10,
            row: r,
            alive: true,
            flash: 0,
            phase: Math.random() * Math.PI * 2,
            hp: hp,
            maxHp: hp
          });
        }
      }
    } while(bricks.length < 40 && attempts < 10);

    /* 极端保底：10 次都抽到稀疏图案时，强制回退到「满铺」重做一次 */
    if(bricks.length < 40){
      pid = 0;
      bricks = [];
      const colorScheme = Math.floor(Math.random() * 3);
      for(let r = 0; r < rows; r++){
        for(let c = 0; c < cols; c++){
          let color;
          if(colorScheme === 0)      color = BRICK_COLORS[r % BRICK_COLORS.length];
          else if(colorScheme === 1) color = BRICK_COLORS[Math.floor(Math.random() * BRICK_COLORS.length)];
          else                       color = BRICK_COLORS[c % BRICK_COLORS.length];
          const roll = Math.random();
          let hp = 1;
          if(roll < 0.06) hp = 3;
          else if(roll < 0.28) hp = 2;
          bricks.push({
            x: BRICK_MARGIN_X + c * (BRICK_W + BRICK_GAP),
            y: marginTop + r * (BRICK_H + BRICK_GAP),
            w: BRICK_W, h: BRICK_H,
            color: color, score: (rows - r) * 10, row: r,
            alive: true, flash: 0, phase: Math.random() * Math.PI * 2,
            hp: hp, maxHp: hp
          });
        }
      }
    }

    G.bricks = bricks;
    G.layoutName = PATTERNS[pid].name;

    /* 只有成功才写入记忆，避免重试污染最近图案列表 */
    G.recentPatterns.push(pid);
    if(G.recentPatterns.length > 5) G.recentPatterns.shift();
  }

  function aliveCount(){
    let n = 0;
    for(const b of G.bricks) if(b.alive) n++;
    return n;
  }

  /* ===================== 道具系统 ===================== */
  const POWERUP_TYPES = [
    /* 增益 */
    { id: 'paddleWide',   color: '#fbbf24', icon: '↔', duration: 15, label: '宽横杠', desc: '横杠变宽 · 15 秒' },
    { id: 'multiball',    color: '#a855f7', icon: '◎', duration: 0,  label: '多球',   desc: '额外生成 2 个球' },
    { id: 'slowBall',     color: '#22d3ee', icon: 'S', duration: 10, label: '慢速',   desc: '球速 ×0.65 · 10 秒' },
    { id: 'laser',        color: '#ef4444', icon: '↑', duration: 12, label: '激光',   desc: '自动发射子弹 · 12 秒' },
    { id: 'extraLife',    color: '#10b981', icon: '♥', duration: 0,  label: '加命',   desc: '生命 +1' },
    { id: 'catch',        color: '#f472b6', icon: '✦', duration: 12, label: '粘球',   desc: '接住后左键/空格再发射 · 12 秒' },
    { id: 'pierce',       color: '#eab308', icon: '➤', duration: 8,  label: '穿透',   desc: '击碎砖块后不反弹 · 8 秒' },
    { id: 'bigBall',      color: '#f59e0b', icon: '🪩', duration: 12, label: '巨球',   desc: '球体积变大 · 12 秒' },
    /* 惩罚 */
    { id: 'paddleNarrow', color: '#dc2626', icon: '⇔', duration: 10, label: '窄横杠', desc: '横杠缩至 65% · 10 秒', bad: true },
    { id: 'fastBall',     color: '#f43f5e', icon: '»', duration: 8,  label: '加速球', desc: '球速 ×1.4 · 8 秒', bad: true },
    { id: 'darkVision',   color: '#8b5cf6', icon: '◐', duration: 6,  label: '视野干扰', desc: '四周变暗 · 6 秒', bad: true },
    { id: 'miniBall',     color: '#64748b', icon: '⚪', duration: 10, label: '迷你球', desc: '球体积变小 · 10 秒', bad: true }
  ];
  /* 索引缓存，方便 drawActiveEffects 与图例复用 */
  const PU = {};
  for(const t of POWERUP_TYPES) PU[t.id] = t;

  /* 右侧常驻图例：增益在上、惩罚在下，从 POWERUP_TYPES 自动生成 */
  function buildLegend(){
    const legend = document.getElementById('legend');
    if(!legend) return;
    const lv = G.level || 1;
    // 图例只显示当前关卡已解锁的道具
    const available = POWERUP_TYPES.filter(t => {
      if(t.bad && lv < 5) return false;
      if((t.id === 'laser' || t.id === 'pierce') && lv < 3) return false;
      return true;
    });
    const goods = available.filter(t => !t.bad);
    const bads  = available.filter(t =>  t.bad);
    const itemHtml = t =>
      '<div class="lgItem" style="color:' + t.color + '">' +
        '<div class="lgIcon">' + t.icon + '</div>' +
        '<div class="lgText"><b>' + t.label + '</b><span>' + t.desc + '</span></div>' +
      '</div>';
    let html = '<div class="lgTitle">增益 · BOOST</div>';
    for(const t of goods) html += itemHtml(t);
    if(bads.length > 0){
      html += '<div class="lgTitle hazard">惩罚 · HAZARD</div>';
      for(const t of bads)  html += itemHtml(t);
    }
    legend.innerHTML = html;
  }

  function spawnPowerup(x, y){
    const lv = G.level;
    // 按关卡解锁池子
    let pool = POWERUP_TYPES.filter(t => {
      if(t.bad && lv < 5) return false; // 惩罚道具5关后出
      if((t.id === 'laser' || t.id === 'pierce') && lv < 3) return false; // 高级增益3关后出
      return true;
    });
    // 按增益/惩罚概率二分（前期没有惩罚，自然全出增益）
    const bads = pool.filter(t => t.bad);
    const goods = pool.filter(t => !t.bad);
    if(bads.length > 0 && Math.random() < 0.35) {
      pool = bads;
    } else {
      pool = goods;
    }
    const tpl = pool[Math.floor(Math.random() * pool.length)];
    G.powerups.push({
      x: x, y: y,
      w: 22, h: 22,
      vy: 95,
      tpl: tpl,
      phase: Math.random() * Math.PI * 2
    });
  }

  function updatePowerups(dt){
    const survivors = [];
    for(const pu of G.powerups){
      pu.y += pu.vy * dt;
      if(pu.y > H + 30) continue;
      const half = G.paddle.w / 2;
      if(pu.y + pu.h / 2 >= PADDLE_Y && pu.y - pu.h / 2 <= PADDLE_Y + PADDLE_H &&
         pu.x >= G.paddle.x - half && pu.x <= G.paddle.x + half){
        G.powerupsCollected++;
        applyPowerup(pu.tpl);
        continue;
      }
      survivors.push(pu);
    }
    G.powerups = survivors;
  }

  function applyPowerup(tpl){
    addFloater(G.paddle.x, PADDLE_Y - 40, tpl.label, tpl.color);
    sfxPowerup();
    G.rings.push({ x: G.paddle.x, y: PADDLE_Y, r: 6, maxR: 60, life: 1, color: tpl.color, w: 2.4 });

    if(tpl.id === 'paddleWide'){
      G.effects.paddleWide = tpl.duration;
      G.effects.paddleNarrow = 0;       /* 宽/窄互斥 */
    } else if(tpl.id === 'paddleNarrow'){
      G.effects.paddleNarrow = tpl.duration;
      G.effects.paddleWide = 0;
    } else if(tpl.id === 'slowBall'){
      /* 慢速与加速互斥：先撤销加速的速度倍率，再应用慢速 */
      if(G.effects.fastBall > 0){
        for(const b of [G.ball, ...G.extraBalls]){
          if(!b.stuck){ b.vx /= 1.4; b.vy /= 1.4; }
        }
        G.effects.fastBall = 0;
      }
      if(G.effects.slowBall <= 0){
        for(const b of [G.ball, ...G.extraBalls]){
          if(!b.stuck){ b.vx *= 0.65; b.vy *= 0.65; }
        }
      }
      G.effects.slowBall = tpl.duration;
    } else if(tpl.id === 'fastBall'){
      /* 加速与慢速互斥：先撤销慢速的速度倍率，再应用加速 */
      if(G.effects.slowBall > 0){
        for(const b of [G.ball, ...G.extraBalls]){
          if(!b.stuck){ b.vx /= 0.65; b.vy /= 0.65; }
        }
        G.effects.slowBall = 0;
      }
      if(G.effects.fastBall <= 0){
        for(const b of [G.ball, ...G.extraBalls]){
          if(!b.stuck){ b.vx *= 1.4; b.vy *= 1.4; }
        }
      }
      G.effects.fastBall = tpl.duration;
    } else if(tpl.id === 'laser'){
      G.effects.laser = tpl.duration;
      G.laserCooldown = 0.2;
    } else if(tpl.id === 'darkVision'){
      G.effects.darkVision = tpl.duration;
    } else if(tpl.id === 'multiball'){
      /* 球被粘住时先释放主球：否则 atan2(0,0)=0，额外球水平向右飞出，
         主球仍 held 不动，与额外球方向不一致 */
      if(G.ball.held) releaseHeldBall();
      const baseSpeed = Math.hypot(G.ball.vx, G.ball.vy) || BASE_SPEED;
      const baseAng = G.ball.stuck ? -Math.PI / 2 : Math.atan2(G.ball.vy, G.ball.vx);
      for(let i = 0; i < 2; i++){
        const ang = baseAng + (i === 0 ? -0.35 : 0.35);
        G.extraBalls.push({
          x: G.ball.x, y: G.ball.y,
          vx: Math.cos(ang) * baseSpeed,
          vy: Math.sin(ang) * baseSpeed,
          stuck: false
        });
      }
      if(G.ball.stuck){
        G.ball.vx = Math.cos(baseAng) * baseSpeed;
        G.ball.vy = Math.sin(baseAng) * baseSpeed;
        G.ball.stuck = false;
      }
    } else if(tpl.id === 'extraLife'){
      G.lives += 1;
      updateHUD('life');
    } else if(tpl.id === 'catch'){
      G.effects.catch = tpl.duration;
    } else if(tpl.id === 'pierce'){
      G.effects.pierce = tpl.duration;
    } else if(tpl.id === 'bigBall'){
      G.effects.bigBall = tpl.duration;
      G.effects.miniBall = 0;
    } else if(tpl.id === 'miniBall'){
      G.effects.miniBall = tpl.duration;
      G.effects.bigBall = 0;
    }
    updatePaddleWidth();
    updateBallRadius();
    if(tpl.bad) showTaunt('bad');
  }

  function updateBallRadius() {
    const s = W / 800;
    if(G.effects.bigBall > 0) BALL_R = 14 * s;
    else if(G.effects.miniBall > 0) BALL_R = 5 * s;
    else BALL_R = 8 * s;
  }

  function updateEffects(dt){
    if(G.effects.paddleWide > 0){
      G.effects.paddleWide -= dt;
      if(G.effects.paddleWide <= 0) G.effects.paddleWide = 0;
    }
    if(G.effects.paddleNarrow > 0){
      G.effects.paddleNarrow -= dt;
      if(G.effects.paddleNarrow <= 0) G.effects.paddleNarrow = 0;
    }
    if(G.effects.slowBall > 0){
      G.effects.slowBall -= dt;
      if(G.effects.slowBall <= 0){
        G.effects.slowBall = 0;
        for(const b of [G.ball, ...G.extraBalls]){
          if(!b.stuck){ b.vx /= 0.65; b.vy /= 0.65; }
        }
      }
    }
    if(G.effects.fastBall > 0){
      G.effects.fastBall -= dt;
      if(G.effects.fastBall <= 0){
        G.effects.fastBall = 0;
        for(const b of [G.ball, ...G.extraBalls]){
          if(!b.stuck){ b.vx /= 1.4; b.vy /= 1.4; }
        }
      }
    }
    if(G.effects.laser > 0){
      G.effects.laser -= dt;
      if(G.effects.laser < 0) G.effects.laser = 0;
    }
    if(G.effects.darkVision > 0){
      G.effects.darkVision -= dt;
      if(G.effects.darkVision < 0) G.effects.darkVision = 0;
    }
    if(G.effects.catch > 0){
      G.effects.catch -= dt;
      if(G.effects.catch <= 0){
        G.effects.catch = 0;
        if(G.ball.held) releaseHeldBall();
      }
    }
    if(G.effects.pierce > 0){
      G.effects.pierce -= dt;
      if(G.effects.pierce <= 0){
        G.effects.pierce = 0;
        /* 穿透结束时清空所有砖的穿透免疫集合，避免残留球引用导致
           下次获得穿透时该球对某砖永久免疫 */
        for(const b of G.bricks){
          if(b._piercedSet && b._piercedSet.size > 0) b._piercedSet.clear();
        }
      }
    }
    if(G.effects.bigBall > 0){
      G.effects.bigBall -= dt;
      if(G.effects.bigBall <= 0) { G.effects.bigBall = 0; updateBallRadius(); }
    }
    if(G.effects.miniBall > 0){
      G.effects.miniBall -= dt;
      if(G.effects.miniBall <= 0) { G.effects.miniBall = 0; updateBallRadius(); }
    }
    updatePaddleWidth();
  }

  /* 根据当前活跃状态统一设定横杠宽度，避免宽/窄互斥逻辑散落各处 */
  function updatePaddleWidth(){
    if(G.effects.paddleWide > 0)         G.paddle.w = PADDLE_W * 1.6;
    else if(G.effects.paddleNarrow > 0)  G.paddle.w = PADDLE_W * 0.65;
    else                                  G.paddle.w = PADDLE_W;
  }

  /* 砖块命中统一处理（球 / 子弹共用）
     - 耐久砖：每击扣 1 点 hp，未击碎时给部分分数 + 裂纹反馈
     - 击碎时补发分数、掉落道具（掉落率 6%，一局约 4~5 个） */
  function hitBrick(brick){
    brick.flash = 1;
    G.combo++;
    if(G.combo > G.maxCombo) G.maxCombo = G.combo;
    
    /* 连击 HUD 更新 */
    if(G.combo >= 2 && comboHudEl && comboNumEl){
      comboHudEl.classList.add('show');
      comboNumEl.textContent = G.combo;
      comboHudEl.classList.remove('bump');
      void comboHudEl.offsetWidth; // 强制重排触发动画
      comboHudEl.classList.add('bump');
      setTimeout(() => { if(comboHudEl) comboHudEl.classList.remove('bump'); }, 100);
    }

    const base = brick.score * G.level;
    const mult = 1 + Math.max(0, G.combo - 1) * 0.12;

    /* 未击碎：扣耐久，给部分分数 */
    if(brick.hp > 1){
      brick.hp -= 1;
      const chipGain = Math.round(base * mult * 0.4);
      G.score += chipGain;
      updateHUD('score');
      sfxBrick(brick.row, G.combo);
      G.shake = Math.max(G.shake, 1.5);
      spawnBurst(brick, 4);
      recordPeak();
      return;
    }

    /* 击碎 */
    brick.alive = false;
    brick.hp = 0;
    G.brokenCount++;
    const gain = Math.round(base * mult);
    G.score += gain;
    updateHUD('score');
    spawnBurst(brick);
    sfxBrick(brick.row, G.combo);
    G.shake = Math.max(G.shake, 3);
    if(navigator.vibrate){
      try { navigator.vibrate(15); } catch(e){}
    }

    if(G.combo >= 3){
      addFloater(
        brick.x + brick.w / 2,
        brick.y + brick.h / 2 - 6,
        '+' + gain + '  ×' + G.combo + ' COMBO',
        brick.color
      );
    }
    if(G.combo > 0 && G.combo % 5 === 0) {
      // 20% 概率触发职场恐吓，否则正常夸奖
      if(Math.random() < 0.2) showTaunt('boss');
      else showTaunt('combo');
    }
    if(brick.maxHp === 3) showTaunt('hard');

    recordPeak();

    if(Math.random() < 0.06){
      spawnPowerup(brick.x + brick.w / 2, brick.y + brick.h / 2);
    }
  }

  /* ===================== 重置 ===================== */
  function resetBallAndPaddle(){
    G.paddle.x = W / 2;
    G.paddle.targetX = W / 2;
    G.paddle.control = 'pointer';
    G.paddle.squash = 0;
    G.paddle.w = PADDLE_W;
    G.ball.x = W / 2;
    G.ball.y = PADDLE_Y - BALL_R - 2;
    G.ball.vx = 0; G.ball.vy = 0;
    G.ball.stuck = true;
    G.trail = [];
    G.stuckSamples = [];
    G.combo = 0;
    G.extraBalls = [];
    G.powerups = [];
    G.bullets = [];
    for(const k in G.effects) G.effects[k] = 0;
    /* 直接归零 effects.pierce 绕过了 updateEffects 里的清理路径，
       loseLife 后旧球引用会残留在砖块 _piercedSet 上，
       导致下一局重新获得穿透时该球对残留砖块永久免疫 */
    for(const b of G.bricks){
      if(b._piercedSet && b._piercedSet.size > 0) b._piercedSet.clear();
    }
    updateBallRadius(); // 恢复初始大小
    G.laserCooldown = 0;
    G.ball.held = false;
    G.ball.heldOffset = 0;
  }

  function resetGame(){
    G.score = 0; G.level = 1; G.lives = 3;
    G.particles = []; G.rings = []; G.floaters = [];
    G.shake = 0; G.combo = 0;
    G.maxCombo = 0; G.brokenCount = 0; G.powerupsCollected = 0;
    G._nextBossTaunt = 0;
    if(comboHudEl) comboHudEl.classList.remove('show');
    if(tauntTimer){ clearTimeout(tauntTimer); tauntTimer = null; }
    if(tauntEl) tauntEl.classList.remove('show');
    buildLegend(); // 重置时刷新图例解锁状态
    switchBgm();
    buildBricks();
    resetBallAndPaddle();
    updateHUD();
    setState('ready');
  }

  /* ===================== 发射 / 生命 / 清关 ===================== */
  function launchBall(){
    if(G.overTimer) return;   /* 清关过渡期拒绝输入，防止刷分 */
    if(G.state === 'ready'){
      let speed = BASE_SPEED * Math.pow(1.10, G.level - 1);
      speed *= (0.95 + Math.random() * 0.10);   // 每关微随机球速
      if(G.effects.slowBall > 0) speed *= 0.65;
      if(G.effects.fastBall > 0) speed *= 1.4;
      speed = Math.min(speed, 950); // 球速硬上限
      const angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.22;
      G.ball.vx = Math.cos(angle) * speed;
      G.ball.vy = Math.sin(angle) * speed;
      G.ball.stuck = false;
      G.stuckSamples = [];
      G.trail = [];
      G.rings.push({ x: G.ball.x, y: G.ball.y, r: 0, maxR: 46, life: 1, color: '#38bdf8', w: 2 });
      G.shake = 3;
      tone(440, 0.08, 'sine', 0.05);
      startBgm(false);
      setState('playing');
    } else if(G.state === 'paused'){
      setState('playing');
    }
  }

  /* 粘球释放：按挡板落点决定角度，复用发射球速公式 */
  function releaseHeldBall(){
    const b = G.ball;
    if(!b.held) return;
    b.held = false;
    let speed = BASE_SPEED * Math.pow(1.10, G.level - 1);
    speed *= (0.95 + Math.random() * 0.10);
    if(G.effects.slowBall > 0) speed *= 0.65;
    if(G.effects.fastBall > 0) speed *= 1.4;
    speed = Math.min(speed, 950); // 球速硬上限
    const half = G.paddle.w / 2;
    /* 用 heldOffset 而非 b.x - G.paddle.x：held 球的位置只在 update 末尾同步，
       释放可能发生在 update 之前（keydown/pointerdown），此时 b.x 是上一帧值，
       直接用会引入 paddle_dx 偏差（单帧最大约 40° 角度偏移） */
    const off = Math.max(-half, Math.min(half, b.heldOffset || 0));
    const t = Math.max(-1, Math.min(1, off / half));
    const angle = t * MAX_BOUNCE_ANGLE;
    b.vx = Math.sin(angle) * speed;
    b.vy = -Math.cos(angle) * speed;
    const minVy = speed * MIN_VY_RATIO;
    if(Math.abs(b.vy) < minVy){
      b.vy = -minVy;
      const s2 = Math.hypot(b.vx, b.vy);
      b.vx *= speed / s2;
      b.vy *= speed / s2;
    }
    tone(440, 0.08, 'sine', 0.05);
    G.rings.push({ x: b.x, y: b.y, r: 0, maxR: 46, life: 1, color: '#f472b6', w: 2 });
  }

  function loseLife(){
    G.lives = Math.max(0, G.lives - 1);
    G.combo = 0;
    if(comboHudEl) comboHudEl.classList.remove('show');
    const wrapEl = document.getElementById('canvasWrap');
    if(wrapEl) wrapEl.classList.remove('last-life');
    G.shake = 10;
    sfxLose();
    if(navigator.vibrate){
      try { navigator.vibrate(80); } catch(e){}
    }
    recordPeak();
    updateHUD('life');
    if(G.lives <= 0){
      showTaunt('lose');
      setState('over');
    } else {
      if(G.lives === 1) showTaunt('lowLife');
      else showTaunt('lose');
      resetBallAndPaddle();
      setState('ready');
    }
  }

  function checkClear(){
    if(G.state !== 'playing') return;
    if(aliveCount() > 0) return;
    const bonus = G.lives * 100;
    G.score += bonus;
    G.level += 1;
    recordPeak();
    updateHUD('level');
    sfxClear();
    G.shake = 5;

    G.state = 'paused';   // 直接设状态，避免 setState('paused') 中间态闪烁
    showOverlay('关卡通过 · ' + G.layoutName, [
      { text: '剩余生命奖励', small: true }
    ], '+' + bonus);
    const p = document.createElement('p');
    p.textContent = '准备第 ' + G.level + ' 关（新布局随机生成）…';
    overlay.appendChild(p);
    overlay.classList.add('show');

    G.overTimer = setTimeout(() => {
      G.overTimer = null;
      buildLegend(); // 进入新关卡刷新图例
      buildBricks();
      resetBallAndPaddle();
      setState('ready');
    }, 1400);
  }

  /* ===================== 粒子 / 冲击波 / 浮动文字 ===================== */
  function spawnBurst(brick, count){
    const cx = brick.x + brick.w / 2;
    const cy = brick.y + brick.h / 2;
    const n = count || 9;
    for(let i = 0; i < n; i++){
      const ang = Math.random() * Math.PI * 2;
      const sp  = 90 + Math.random() * 190;
      const life = 0.5 + Math.random() * 0.5;
      G.particles.push({
        x: cx, y: cy,
        vx: Math.cos(ang) * sp,
        vy: Math.sin(ang) * sp,
        life: life,
        maxLife: life,
        size: 2.5 + Math.random() * 3.5,
        color: brick.color
      });
    }
    G.rings.push({ x: cx, y: cy, r: 4, maxR: 34, life: 1, color: brick.color, w: 2.2 });
  }

  function addFloater(x, y, text, color){
    G.floaters.push({ x, y, text, color: color || '#fbbf24', life: 1, maxLife: 1, vy: -42 });
  }

  /* 显示赛博旁白 */
  let tauntTimer = null;
  function showTaunt(type) {
    if (!tauntEl || !TAUNTS[type]) return;
    const text = pickTaunt(type);
    if(!text) return;
    tauntEl.textContent = text;
    tauntEl.classList.add('show');
    
    // 打字音效
    if(G.soundOn){
      tone(800, 0.05, 'square', 0.02);
      setTimeout(()=>tone(900, 0.05, 'square', 0.02), 80);
    }
    
    if (tauntTimer) clearTimeout(tauntTimer);
    tauntTimer = setTimeout(() => {
      tauntEl.classList.remove('show');
    }, 2200);
  }

  function updateParticles(dt){
    // 性能优化：原地 swap-remove 代替 filter，减少 GC
    for(let i = G.particles.length - 1; i >= 0; i--){
      const p = G.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 420 * dt;
      p.vx *= (1 - 0.9 * dt);
      p.life -= dt;
      if(p.life <= 0) {
        G.particles[i] = G.particles[G.particles.length - 1];
        G.particles.pop();
      }
    }

    for(let i = G.rings.length - 1; i >= 0; i--){
      const r = G.rings[i];
      r.r += 260 * dt;
      r.life -= 2.6 * dt;
      if(r.life <= 0) {
        G.rings[i] = G.rings[G.rings.length - 1];
        G.rings.pop();
      }
    }

    for(let i = G.floaters.length - 1; i >= 0; i--){
      const f = G.floaters[i];
      f.y += f.vy * dt;
      f.life -= 1.6 * dt;
      if(f.life <= 0) {
        G.floaters[i] = G.floaters[G.floaters.length - 1];
        G.floaters.pop();
      }
    }

    if(G.shake > 0) G.shake *= Math.pow(0.001, dt);
    if(G.shake < 0.2) G.shake = 0;
  }

  /* ===================== 物理 ===================== */
  function updatePaddle(dt){
    if(G.paddle.control === 'pointer'){
      /* 触屏：最大速度追随，手指快速横移时挡板跟得上，松手即停 */
      const dx = G.paddle.targetX - G.paddle.x;
      const maxStep = PADDLE_SPEED * 1.3 * dt;
      if(Math.abs(dx) <= maxStep){
        G.paddle.x = G.paddle.targetX;
      } else {
        G.paddle.x += Math.sign(dx) * maxStep;
      }
    } else {
      let dx = 0;
      if(G.keys['ArrowLeft']  || G.keys['a'] || G.keys['A']) dx -= 1;
      if(G.keys['ArrowRight'] || G.keys['d'] || G.keys['D']) dx += 1;
      if(dx !== 0) G.paddle.x += dx * PADDLE_SPEED * dt;
    }
    const half = G.paddle.w / 2;
    G.paddle.x = Math.max(half + WALL, Math.min(W - half - WALL, G.paddle.x));

    if(G.paddle.squash > 0){
      G.paddle.squash -= dt * 6;
      if(G.paddle.squash < 0) G.paddle.squash = 0;
    }
  }

  function stepBall(ball, dt){
    const b = ball;
    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if(b.x - BALL_R < WALL){ b.x = WALL + BALL_R; b.vx = Math.abs(b.vx); sfxWall(); G.shake = Math.max(G.shake, 1.5); }
    if(b.x + BALL_R > W - WALL){ b.x = W - WALL - BALL_R; b.vx = -Math.abs(b.vx); sfxWall(); G.shake = Math.max(G.shake, 1.5); }
    if(b.y - BALL_R < WALL){ b.y = WALL + BALL_R; b.vy = Math.abs(b.vy); sfxWall(); G.shake = Math.max(G.shake, 1.5); }

    if(b.vy > 0 && b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + PADDLE_H){
      const half = G.paddle.w / 2;
      const px1 = G.paddle.x - half, px2 = G.paddle.x + half;
      if(b.x >= px1 - BALL_R * 0.5 && b.x <= px2 + BALL_R * 0.5){
        const speed = Math.hypot(b.vx, b.vy) || BASE_SPEED;
        const t = Math.max(-1, Math.min(1, (b.x - G.paddle.x) / half));
        const angle = t * MAX_BOUNCE_ANGLE;
        b.vx = Math.sin(angle) * speed;
        b.vy = -Math.cos(angle) * speed;
        const minVy = speed * MIN_VY_RATIO;
        if(Math.abs(b.vy) < minVy){
          b.vy = -minVy;
          const s2 = Math.hypot(b.vx, b.vy);
          b.vx *= speed / s2;
          b.vy *= speed / s2;
        }
        b.y = PADDLE_Y - BALL_R;
        /* 只有主球碰挡板才清连击；额外球碰挡板不影响主球正在延续的连击 */
        if(b === G.ball){
          G.combo = 0;
          if(comboHudEl) comboHudEl.classList.remove('show');
        }
        G.paddle.squash = 1;
        G.rings.push({ x: b.x, y: PADDLE_Y + PADDLE_H / 2, r: 6, maxR: 40, life: 1, color: '#38bdf8', w: 2 });
        sfxPaddle();
        G.shake = Math.max(G.shake, 2);

        /* 粘球：仅对主球生效，接住后停在挡板上等待再次发射 */
        if(G.effects.catch > 0 && b === G.ball){
          b.vx = 0; b.vy = 0;
          b.held = true;
          /* 记录接住瞬间相对挡板中心的横向偏移，释放时据此决定角度 */
          b.heldOffset = Math.max(-half, Math.min(half, b.x - G.paddle.x));
        }
      }
    }

    /* 穿透状态：清理已离开砖块 AABB 的球标记。
       用 Set 记录所有正在穿透该砖的球，多球时互相独立，避免互相顶掉标记。 */
    if(G.effects.pierce > 0){
      for(const brick of G.bricks){
        const set = brick._piercedSet;
        if(!set || set.size === 0) continue;
        for(const pb of set){
          const pnx = Math.max(brick.x, Math.min(pb.x, brick.x + brick.w));
          const pny = Math.max(brick.y, Math.min(pb.y, brick.y + brick.h));
          const pddx = pb.x - pnx, pddy = pb.y - pny;
          if(pddx * pddx + pddy * pddy >= BALL_R * BALL_R) set.delete(pb);
        }
      }
    }

    for(const brick of G.bricks){
      if(!brick.alive) continue;
      const nx = Math.max(brick.x, Math.min(b.x, brick.x + brick.w));
      const ny = Math.max(brick.y, Math.min(b.y, brick.y + brick.h));
      const ddx = b.x - nx, ddy = b.y - ny;
      if(ddx * ddx + ddy * ddy >= BALL_R * BALL_R) continue;

      /* 穿透球：不反弹，直接扣耐久；同一块砖对同一颗球在穿透状态下只触发一次 */
      if(G.effects.pierce > 0){
        if(!brick._piercedSet) brick._piercedSet = new Set();
        if(!brick._piercedSet.has(b)){
          brick._piercedSet.add(b);
          hitBrick(brick);
        }
        continue;
      }

      const bxc = brick.x + brick.w / 2;
      const byc = brick.y + brick.h / 2;
      const relX = b.x - bxc;
      const relY = b.y - byc;
      const penX = (brick.w / 2 + BALL_R) - Math.abs(relX);
      const penY = (brick.h / 2 + BALL_R) - Math.abs(relY);

      if(penX < penY){
        b.vx = relX > 0 ? Math.abs(b.vx) : -Math.abs(b.vx);
        b.x += relX > 0 ? penX : -penX;
      } else {
        b.vy = relY > 0 ? Math.abs(b.vy) : -Math.abs(b.vy);
        b.y += relY > 0 ? penY : -penY;
      }

      hitBrick(brick);
      break;
    }

    if(b.y - BALL_R > H){
      return 'out';
    }
    return 'ok';
  }

  function update(dt){
    dt = Math.min(dt, 0.05);
    updatePaddle(dt);
    updateEffects(dt);

    /* 职场恐吓：每过 45~60 秒，有概率突然弹出摸鱼警告 */
    if(!G._nextBossTaunt) G._nextBossTaunt = performance.now() + 45000 + Math.random() * 15000;
    if(performance.now() > G._nextBossTaunt){
      showTaunt('boss');
      G._nextBossTaunt = performance.now() + 45000 + Math.random() * 15000;
    }

    /* 主球 */
    if(G.ball.stuck){
      G.ball.x = G.paddle.x;
      G.ball.y = PADDLE_Y - BALL_R - 2;
    } else if(G.ball.held){
      /* 粘球：跟随挡板并保留接住时的横向偏移，等待玩家释放 */
      const half = G.paddle.w / 2;
      let off = G.ball.heldOffset || 0;
      off = Math.max(-half, Math.min(half, off));
      G.ball.heldOffset = off;
      G.ball.x = G.paddle.x + off;
      G.ball.y = PADDLE_Y - BALL_R - 2;
      G.ball.vx = 0;
      G.ball.vy = 0;
    } else {
      const speed = Math.hypot(G.ball.vx, G.ball.vy);
      const steps = Math.max(1, Math.ceil(speed * dt / (BALL_R * 0.8)));
      const sdt = dt / steps;
      for(let s = 0; s < steps; s++){
        const r = stepBall(G.ball, sdt);
        if(r === 'out'){
          if(G.extraBalls.length > 0){
            const next = G.extraBalls.shift();
            G.ball.x = next.x;
            G.ball.y = next.y;
            G.ball.vx = next.vx;
            G.ball.vy = next.vy;
            G.ball.stuck = false;
            G.trail = [];
          } else {
            loseLife();
            return;
          }
          break;
        }
        if(G.state !== 'playing') return;
      }

      if(!G.ball.stuck){
        const last = G.trail[G.trail.length - 1];
        if(!last || Math.hypot(G.ball.x - last.x, G.ball.y - last.y) > 4){
          G.trail.push({ x: G.ball.x, y: G.ball.y });
          if(G.trail.length > 18) G.trail.shift();
        }
      }
    }

    /* 额外球 */
    const survivors = [];
    for(const eb of G.extraBalls){
      const speed = Math.hypot(eb.vx, eb.vy);
      const steps = Math.max(1, Math.ceil(speed * dt / (BALL_R * 0.8)));
      const sdt = dt / steps;
      let dead = false;
      for(let s = 0; s < steps; s++){
        if(stepBall(eb, sdt) === 'out'){ dead = true; break; }
      }
      if(!dead) survivors.push(eb);
    }
    G.extraBalls = survivors;

    if(G.state !== 'playing') return;

    /* 防卡死（仅对真正飞行的主球生效，stuck/held 不参与，避免无意义采样） */
    if(!G.ball.stuck && !G.ball.held){
      const now = performance.now();
      G.stuckSamples.push({ x: G.ball.x, y: G.ball.y, t: now });
      for(let i = G.stuckSamples.length - 1; i >= 0; i--){
        if(now - G.stuckSamples[i].t >= 1500){
          G.stuckSamples[i] = G.stuckSamples[G.stuckSamples.length - 1];
          G.stuckSamples.pop();
        }
      }
      if(G.stuckSamples.length > 24){
        let minX = 1e9, maxX = -1e9, minY = 1e9, maxY = -1e9;
        for(const p of G.stuckSamples){
          if(p.x < minX) minX = p.x; if(p.x > maxX) maxX = p.x;
          if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
        }
        if(maxX - minX < 60 && maxY - minY < 60){
          const ang = Math.atan2(G.ball.vy, G.ball.vx) + (Math.random() - 0.5) * 0.5;
          const sp  = Math.hypot(G.ball.vx, G.ball.vy) || BASE_SPEED;
          G.ball.vx = Math.cos(ang) * sp;
          G.ball.vy = Math.sin(ang) * sp;
          G.stuckSamples = [];
        }
      }
    }

    /* 激光发射 */
    if(G.effects.laser > 0){
      G.laserCooldown -= dt;
      if(G.laserCooldown <= 0){
        G.laserCooldown = 0.28;
        const pw = G.paddle.w;
        G.bullets.push({ x: G.paddle.x - pw / 2 + 8, y: PADDLE_Y, vy: -520 });
        G.bullets.push({ x: G.paddle.x + pw / 2 - 8, y: PADDLE_Y, vy: -520 });
        tone(880, 0.04, 'square', 0.025);
      }
    }

    /* 子弹更新 */
    const aliveBullets = [];
    for(const bullet of G.bullets){
      bullet.y += bullet.vy * dt;
      if(bullet.y < -10) continue;
      let hit = false;
      for(const brick of G.bricks){
        if(!brick.alive) continue;
        /* 用子弹视觉体 [y-10, y+4] 与砖块 AABB 做区间重叠判定，与 drawBullets 的绘制长度一致；
           比中心点判定多覆盖 14px，降低大步长漏判概率 */
        if(bullet.x >= brick.x && bullet.x <= brick.x + brick.w &&
           bullet.y + 4 >= brick.y && bullet.y - 10 <= brick.y + brick.h){
          hitBrick(brick);
          hit = true;
          break;
        }
      }
      if(!hit) aliveBullets.push(bullet);
    }
    G.bullets = aliveBullets;

    /* 道具下落与拾取 */
    updatePowerups(dt);
  }

  /* ===================== 渲染 ===================== */
  function roundRect(c, x, y, w, h, r){
    r = Math.min(r, w / 2, h / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.arcTo(x + w, y, x + w, y + r, r);
    c.lineTo(x + w, y + h - r);
    c.arcTo(x + w, y + h, x + w - r, y + h, r);
    c.lineTo(x + r, y + h);
    c.arcTo(x, y + h, x, y + h - r, r);
    c.lineTo(x, y + r);
    c.arcTo(x, y, x + r, y, r);
    c.closePath();
  }

  const hexACache = new Map();
  function hexA(hex, a){
    const key = hex + '|' + a;
    let v = hexACache.get(key);
    if(v !== undefined) return v;
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    v = 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
    hexACache.set(key, v);
    return v;
  }

  /* 砖块渐变按颜色缓存（相对坐标，配合 translate 复用，避免每帧 createLinearGradient） */
  const brickGradCache = new Map();
  function getBrickGrad(color){
    let g = brickGradCache.get(color);
    if(!g){
      g = ctx.createLinearGradient(0, 0, 0, BRICK_H);
      g.addColorStop(0, hexA(color, 0.55));
      g.addColorStop(0.45, hexA(color, 0.26));
      g.addColorStop(1, hexA(color, 0.10));
      brickGradCache.set(color, g);
    }
    return g;
  }

  function drawStars(now, dt){
    ctx.save();
    for(const s of G.stars){
      s.y += s.sp * dt;
      if(s.y > H + 4){ s.y = -4; s.x = Math.random() * W; }
      const tw = 0.55 + 0.45 * Math.sin(now * 0.0015 + s.tw);
      ctx.globalAlpha = s.a * tw;
      ctx.fillStyle = '#bae6fd';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  let _wallGradCache = null;
  function getWallGrad(){
    if(!_wallGradCache){
      _wallGradCache = ctx.createLinearGradient(0, 0, 0, H);
      _wallGradCache.addColorStop(0, 'rgba(56,189,248,0.18)');
      _wallGradCache.addColorStop(1, 'rgba(56,189,248,0.04)');
    }
    return _wallGradCache;
  }

  function drawWalls(){
    ctx.save();
    ctx.fillStyle = getWallGrad();
    ctx.fillRect(0, 0, WALL, H);
    ctx.fillRect(W - WALL, 0, WALL, H);
    ctx.fillRect(0, 0, W, WALL);

    ctx.strokeStyle = 'rgba(56,189,248,0.5)';
    ctx.lineWidth = 1;
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(WALL + 0.5, 0); ctx.lineTo(WALL + 0.5, H);
    ctx.moveTo(W - WALL - 0.5, 0); ctx.lineTo(W - WALL - 0.5, H);
    ctx.moveTo(0, WALL + 0.5); ctx.lineTo(W, WALL + 0.5);
    ctx.stroke();
    ctx.restore();
  }

  function drawBricks(now){
    const alive = aliveCount();
    const total = Math.max(1, G.bricks.length);
    const tension = alive / total < 0.2
      ? 1 + (0.2 - alive / total) * 5
      : 1;

    for(const b of G.bricks){
      if(!b.alive && b.flash <= 0) continue;

      if(!b.alive){
        ctx.save();
        ctx.globalAlpha = b.flash * 0.9;
        ctx.fillStyle = '#ffffff';
        roundRect(ctx, b.x, b.y, b.w, b.h, 4);
        ctx.fill();
        ctx.restore();
        continue;
      }

      const pulse = 0.92 + 0.08 * Math.sin(now * 0.0022 + b.phase);
      const glow = 10 * tension * pulse;
      const maxHp = b.maxHp || 1;
      const isArmored = maxHp > 1;
      const armorT = isArmored ? (b.hp - 1) / (maxHp - 1) : 0;

      ctx.save();
      ctx.translate(b.x, b.y);
      // 性能优化：仅在被击中或残血紧张时开阴影，其他时候关闭
      if (b.flash > 0 || tension > 1) {
        ctx.shadowColor = b.color;
        ctx.shadowBlur = glow;
      }

      // 渐变按颜色缓存 + 相对坐标，避免每帧、每块砖 createLinearGradient
      ctx.fillStyle = getBrickGrad(b.color);
      roundRect(ctx, 0, 0, b.w, b.h, 4);
      ctx.fill();

      /* 耐久砖：叠冷色装甲遮罩，剩余耐久越多越深 */
      if(isArmored){
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(15,23,42,' + (0.25 + armorT * 0.45).toFixed(3) + ')';
        roundRect(ctx, 0, 0, b.w, b.h, 4);
        ctx.fill();
      }

      ctx.shadowBlur = 0;
      ctx.strokeStyle = hexA(b.color, 0.9);
      ctx.lineWidth = isArmored ? 1.8 : 1.2;
      roundRect(ctx, 0.6, 0.6, b.w - 1.2, b.h - 1.2, 3.6);
      ctx.stroke();

      ctx.fillStyle = hexA(b.color, 0.55);
      roundRect(ctx, 4, 2, b.w - 8, 2, 1);
      ctx.fill();

      /* 耐久数字角标 */
      if(isArmored){
        ctx.font = 'bold 11px "JetBrains Mono",Menlo,monospace';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'bottom';
        ctx.fillStyle = '#f8fafc';
        ctx.shadowColor = '#0f172a';
        ctx.shadowBlur = 4;
        ctx.fillText(String(b.hp), b.w - 4, b.h - 3);
        ctx.shadowBlur = 0;
      }

      ctx.restore();
    }
  }

  function drawRings(){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(const r of G.rings){
      ctx.globalAlpha = Math.max(0, r.life);
      ctx.strokeStyle = r.color;
      ctx.lineWidth = r.w * Math.max(0.3, r.life);
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawParticles(){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(const p of G.particles){
      ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.restore();
  }

  function drawFloaters(){
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = 'bold 13px "JetBrains Mono","SF Mono",Menlo,Consolas,monospace';
    for(const f of G.floaters){
      ctx.globalAlpha = Math.max(0, f.life);
      ctx.fillStyle = f.color;
      ctx.shadowColor = f.color;
      ctx.shadowBlur = 10;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.restore();
  }

  function drawBallTrail(){
    if(!G.trail.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for(let i = 0; i < G.trail.length; i++){
      const t = i / G.trail.length;
      const pt = G.trail[i];
      ctx.globalAlpha = t * t * 0.55;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, BALL_R * (0.3 + t * 0.7), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawBall(){
    const b = G.ball;
    if(!b.stuck && !b.held){
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 24;
      const rg = ctx.createRadialGradient(b.x - 2, b.y - 2, 0, b.x, b.y, BALL_R);
      rg.addColorStop(0, '#e0f2fe');
      rg.addColorStop(0.5, '#7dd3fc');
      rg.addColorStop(1, '#0ea5e9');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(b.x - BALL_R * 0.35, b.y - BALL_R * 0.35, BALL_R * 0.32, 0, Math.PI * 2);
      ctx.fill();
    } else if(b.held){
      /* 粘球：粉色脉动 + 发射提示 */
      const t = performance.now() * 0.005;
      const pulse = 0.5 + 0.5 * Math.sin(t);
      ctx.save();
      ctx.shadowColor = '#f472b6';
      ctx.shadowBlur = 16 + pulse * 10;
      ctx.fillStyle = '#f472b6';
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R * (0.95 + pulse * 0.1), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.font = 'bold 10px "JetBrains Mono",Menlo,monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillStyle = '#f472b6';
      ctx.shadowColor = '#0f172a';
      ctx.shadowBlur = 4;
      ctx.fillText(IS_COARSE ? '点发射按钮' : '左键/空格发射', b.x, b.y - BALL_R - 6);
      ctx.restore();
    } else {
      const t = performance.now() * 0.005;
      const pulse = 0.5 + 0.5 * Math.sin(t);
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 14 + pulse * 10;
      ctx.fillStyle = '#38bdf8';
      ctx.beginPath();
      ctx.arc(b.x, b.y, BALL_R * (0.9 + pulse * 0.15), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = 'rgba(56,189,248,' + (0.35 + 0.3 * pulse) + ')';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(b.x, b.y + BALL_R);
      ctx.lineTo(G.paddle.x, PADDLE_Y);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawExtraBalls(){
    for(const eb of G.extraBalls){
      ctx.save();
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 20;
      const rg = ctx.createRadialGradient(eb.x - 2, eb.y - 2, 0, eb.x, eb.y, BALL_R);
      rg.addColorStop(0, '#e0f2fe');
      rg.addColorStop(0.5, '#7dd3fc');
      rg.addColorStop(1, '#0ea5e9');
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, BALL_R, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawBullets(){
    ctx.save();
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 12;
    for(const b of G.bullets){
      ctx.fillStyle = '#ef4444';
      ctx.fillRect(b.x - 1.5, b.y - 10, 3, 14);
      ctx.fillStyle = '#fef3c7';
      ctx.fillRect(b.x - 1, b.y - 8, 2, 6);
    }
    ctx.restore();
  }

  function drawPowerups(now){
    for(const pu of G.powerups){
      const t = now * 0.004 + pu.phase;
      const scale = 1 + 0.1 * Math.sin(t);
      const size = pu.w * scale;

      ctx.save();
      ctx.translate(pu.x, pu.y);
      ctx.shadowColor = pu.tpl.color;
      ctx.shadowBlur = 14;
      ctx.strokeStyle = pu.tpl.color;
      ctx.lineWidth = 2;
      roundRect(ctx, -size / 2, -size / 2, size, size, 5);
      ctx.stroke();
      ctx.fillStyle = hexA(pu.tpl.color, 0.25);
      roundRect(ctx, -size / 2 + 2, -size / 2 + 2, size - 4, size - 4, 4);
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = pu.tpl.color;
      ctx.font = 'bold 14px "JetBrains Mono",Menlo,monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(pu.tpl.icon, 0, 1);
      ctx.restore();
    }
  }

  function drawActiveEffects(){
    let y = H - 70;
    for(const key of EFFECT_ORDER){
      const t = G.effects[key];
      if(t <= 0) continue;
      const tpl = PU[key];
      if(!tpl) continue;
      ctx.save();
      ctx.fillStyle = tpl.color;
      ctx.shadowColor = tpl.color;
      ctx.shadowBlur = 8;
      ctx.font = 'bold 11px "JetBrains Mono",Menlo,monospace';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(tpl.icon + ' ' + tpl.label + '  ' + Math.ceil(t) + 's', WALL + 8, y);
      ctx.restore();
      y -= 18;
    }
  }

  const _paddleGradCache = {};
  function getPaddleGrad(key, pw){
    /* key 里带上 pw，避免宽/窄切换后宽度变了但渐变仍返回旧值 */
    const cacheKey = key + '|' + pw;
    if(_paddleGradCache[cacheKey]) return _paddleGradCache[cacheKey];
    const pg = ctx.createLinearGradient(0, 0, pw, 0);
    if(key === 'wide'){
      pg.addColorStop(0, '#d97706');
      pg.addColorStop(0.3, '#fbbf24');
      pg.addColorStop(0.5, '#fef3c7');
      pg.addColorStop(0.7, '#fbbf24');
      pg.addColorStop(1, '#d97706');
    } else if(key === 'narrow'){
      pg.addColorStop(0, '#7f1d1d');
      pg.addColorStop(0.3, '#dc2626');
      pg.addColorStop(0.5, '#fecaca');
      pg.addColorStop(0.7, '#dc2626');
      pg.addColorStop(1, '#7f1d1d');
    } else {
      pg.addColorStop(0, '#0284c7');
      pg.addColorStop(0.3, '#38bdf8');
      pg.addColorStop(0.5, '#bae6fd');
      pg.addColorStop(0.7, '#38bdf8');
      pg.addColorStop(1, '#0284c7');
    }
    _paddleGradCache[cacheKey] = pg;
    return pg;
  }

  function drawPaddle(now){
    const pw = G.paddle.w;
    const squash = G.paddle.squash;
    const h = PADDLE_H * (1 - squash * 0.35);
    const y = PADDLE_Y + (PADDLE_H - h);

    ctx.save();
    ctx.translate(G.paddle.x - pw / 2, y);

    const wide   = G.effects.paddleWide > 0;
    const narrow = G.effects.paddleNarrow > 0;
    ctx.shadowColor = wide ? '#fbbf24' : (narrow ? '#dc2626' : '#38bdf8');
    ctx.shadowBlur = wide ? 26 : (narrow ? 22 : 18);

    ctx.fillStyle = getPaddleGrad(wide ? 'wide' : (narrow ? 'narrow' : 'normal'), pw);
    roundRect(ctx, 0, 0, pw, h, h / 2);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(h / 2, h / 2, h * 0.28, 0, Math.PI * 2);
    ctx.arc(pw - h / 2, h / 2, h * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  let _centerGlowCache = null;
  function getCenterGlow(){
    if(!_centerGlowCache){
      _centerGlowCache = ctx.createRadialGradient(W / 2, H * 0.62, 0, W / 2, H * 0.62, W * 0.7);
      _centerGlowCache.addColorStop(0, 'rgba(56,189,248,0.05)');
      _centerGlowCache.addColorStop(0.5, 'rgba(56,189,248,0.02)');
      _centerGlowCache.addColorStop(1, 'rgba(56,189,248,0)');
    }
    return _centerGlowCache;
  }

  function drawCenterGlow(){
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = getCenterGlow();
