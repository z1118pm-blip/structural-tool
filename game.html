    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  let _vignetteCache = null;
  function getVignette(){
    if(!_vignetteCache){
      _vignetteCache = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.32, W / 2, H / 2, Math.max(W, H) * 0.78);
      _vignetteCache.addColorStop(0, 'rgba(0,0,0,0)');
      _vignetteCache.addColorStop(1, 'rgba(0,0,0,0.45)');
    }
    return _vignetteCache;
  }

  function drawVignette(){
    ctx.save();
    ctx.fillStyle = getVignette();
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  /* 视野干扰：叠加强烈的紫黑色径向遮罩，边缘几乎全黑 */
  function drawDarkVision(){
    const t = G.effects.darkVision;
    if(t <= 0) return;
    const intensity = Math.min(0.88, 0.45 + t * 0.07);
    ctx.save();
    const vg = ctx.createRadialGradient(W / 2, H * 0.55, Math.min(W, H) * 0.22, W / 2, H * 0.55, Math.max(W, H) * 0.62);
    vg.addColorStop(0, 'rgba(10,2,20,0)');
    vg.addColorStop(0.65, 'rgba(10,2,20,' + (intensity * 0.55).toFixed(3) + ')');
    vg.addColorStop(1, 'rgba(10,2,20,' + intensity.toFixed(3) + ')');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function draw(now, dt){
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);

    if(bgCanvas){
      ctx.drawImage(bgCanvas, 0, 0, cw, ch);
    } else {
      ctx.fillStyle = '#04070f';
      ctx.fillRect(0, 0, cw, ch);
    }

    ctx.save();
    ctx.scale(cw / W, ch / H);

    if(G.shake > 0.2){
      const sx = (Math.random() - 0.5) * G.shake;
      const sy = (Math.random() - 0.5) * G.shake;
      ctx.translate(sx, sy);
    }

    drawStars(now, dt || 0);
    drawWalls();
    drawBricks(now);
    drawRings();
    drawParticles();
    drawBallTrail();
    drawExtraBalls();
    drawBall();
    drawPaddle(now);
    drawBullets();
    drawPowerups(now);
    drawActiveEffects();
    drawFloaters();
    drawCenterGlow();
    drawVignette();
    drawDarkVision();

    ctx.restore();
  }

  /* ===================== 主循环 ===================== */
  let lastT = performance.now();

  function loop(now){
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    if(G.state === 'playing'){
      update(dt);
      if(G.state === 'playing') checkClear();
    } else if(G.state === 'ready'){
      updatePaddle(dt);
      G.ball.x = G.paddle.x;
      G.ball.y = PADDLE_Y - BALL_R - 2;
      updateEffects(dt);
      updatePowerups(dt);
    }

    for(const b of G.bricks){
      if(b.flash > 0){
        b.flash -= dt * 5;
        if(b.flash < 0) b.flash = 0;
      }
    }

    updateParticles(dt);
    /* 暂停/结束时星星冻结，与暂停语义一致；ready/playing 正常漂移 */
    const starDt = (G.state === 'paused' || G.state === 'over') ? 0 : dt;
    draw(now, starDt);
    requestAnimationFrame(loop);
  }

  /* ===================== 输入 ===================== */
  window.addEventListener('keydown', e => {
    const k = e.key;
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(k)) e.preventDefault();
    G.keys[k] = true;
    if(k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'A' || k === 'd' || k === 'D'){
      G.paddle.control = 'keyboard';
    }
    ensureAudio();

    if(k === ' '){
      kickFullscreenOnce();
      if(G.state === 'ready' || G.state === 'paused') launchBall();
      else if(G.state === 'playing' && G.ball.held) releaseHeldBall();
    } else if(k === 'Escape'){
      /* ESC 统一负责暂停/继续，是唯一主动打断游戏的键。
         注：全屏状态下浏览器会先退出全屏，再按一次才暂停。 */
      if(G.state === 'playing') setState('paused');
      else if(G.state === 'paused' && !G.overTimer) setState('playing');
    } else if(k === 'p' || k === 'P'){
      if(G.state === 'playing') setState('paused');
      else if(G.state === 'paused' && !G.overTimer) setState('playing');
    } else if(k === 'r' || k === 'R'){
      resetGame();
    }
  }, { passive: false });

  window.addEventListener('keyup', e => { G.keys[e.key] = false; });

  canvasWrap.addEventListener('pointermove', e => {
    if(G.state !== 'playing' && G.state !== 'ready') return;
    const [lx] = fromScreen(e.clientX, e.clientY);
    G.paddle.targetX = lx;
    G.paddle.control = 'pointer';
  });
  canvasWrap.addEventListener('pointerdown', e => {
    /* 暂停/结束浮层上的按钮：不拦截，让 click 正常触发 */
    if(e.target && e.target.closest && e.target.closest('.overlayBtn')) return;
    ensureAudio();
    kickFullscreenOnce();
    if(G.state === 'ready'){ launchBall(); }
    else if(G.state === 'paused' && !G.overTimer){ setState('playing'); }
    else if(G.state === 'playing' && G.ball.held){ releaseHeldBall(); }
    if(G.state === 'playing' || G.state === 'ready'){
      const [lx] = fromScreen(e.clientX, e.clientY);
      G.paddle.targetX = lx;
      G.paddle.control = 'pointer';
    }
  });

  if(btnLaunch){
    btnLaunch.addEventListener('click', () => {
      ensureAudio();
      kickFullscreenOnce();
      if(G.state === 'ready' || G.state === 'paused') launchBall();
      else if(G.state === 'playing' && G.ball.held) releaseHeldBall();
    });
  }
  if(btnPause){
    btnPause.addEventListener('click', () => {
      if(G.state === 'playing') setState('paused');
      else if(G.state === 'paused' && !G.overTimer) setState('playing');
    });
  }

  /* 移动端左右方向键：按住连续移动，松开停止 */
  const btnLeftEl  = document.getElementById('btnLeft');
  const btnRightEl = document.getElementById('btnRight');
  const bindHoldKey = (btn, key) => {
    if(!btn) return;
    const start = (e) => { e.preventDefault(); G.keys[key] = true; G.paddle.control = 'keyboard'; ensureAudio(); };
    const stop  = (e) => { if(e) e.preventDefault(); G.keys[key] = false; };
    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('contextmenu', e => e.preventDefault());
  };
  bindHoldKey(btnLeftEl,  'ArrowLeft');
  bindHoldKey(btnRightEl, 'ArrowRight');

  /* 道具图例切换 */
  const btnLegendEl = document.getElementById('btnLegend');
  if(btnLegendEl){
    btnLegendEl.addEventListener('click', () => {
      const lg = document.getElementById('legend');
      if(lg) lg.classList.toggle('show');
    });
  }

  /* 全屏切换 */
  const btnFullEl = document.getElementById('btnFull');
  if(btnFullEl){
    btnFullEl.addEventListener('click', () => {
      const el = document.getElementById('wrap');
      if(!document.fullscreenElement){
        if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
        else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
      } else {
        if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
        else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    });
  }

  window.addEventListener('blur', () => {
    /* 失焦只清按键状态，不再自动暂停。
       鼠标模式下游玩时，QQ/微信弹窗等意外失焦不再打断游戏；
       暂停/退出统一由 ESC 触发。 */
    G.keys = {};
  });
  document.addEventListener('visibilitychange', () => {
    /* 页面隐藏时 rAF 自然停止，切回来继续；不再自动暂停。
       清空按键状态，防止切标签页时 keyup 丢失导致卡键。 */
    if(document.hidden) G.keys = {};
  });

  /* 音量滑块：同时作用于 BGM 与 SFX */
  if(volRange){
    volRange.addEventListener('input', () => {
      G.volume = parseFloat(volRange.value) || 0;
      applyVolume();
    });
  }
  applyVolume();

  /* 音乐 / 音效 开关（不持久化，刷新恢复默认） */
  if(btnMusic){
    btnMusic.classList.toggle('on', G.musicOn);
    btnMusic.addEventListener('click', () => {
      G.musicOn = !G.musicOn;
      btnMusic.classList.toggle('on', G.musicOn);
      btnMusic.textContent = G.musicOn ? '🎵 音乐' : '🔇 音乐';
      if(G.musicOn){
        startBgm(false);   /* 从暂停点继续，不重置位置 */
      } else {
        pauseBgm();
      }
    });
  }
  if(btnSound){
    btnSound.classList.toggle('on', G.soundOn);
    btnSound.addEventListener('click', () => {
      G.soundOn = !G.soundOn;
      btnSound.classList.toggle('on', G.soundOn);
      btnSound.textContent = G.soundOn ? '🔊 音效' : '🔈 音效';
      if(G.soundOn){ ensureAudio(); tone(660, 0.08, 'sine', 0.05); }
    });
  }

  /* 首次用户交互触发 BGM 播放（浏览器 autoplay policy 要求） */
  function ensureBgmKick(){
    if(bgmStarted || !G.musicOn) return;
    if(!currentBgm) currentBgm = pickBgm();
    startBgm(false);
  }
  window.addEventListener('keydown', ensureBgmKick);
  window.addEventListener('pointerdown', ensureBgmKick);

  /* 首次用户交互自动请求全屏。
     浏览器安全策略要求全屏必须由用户手势触发，无法在页面加载时自动全屏；
     iOS Safari 对 div 全屏支持极差，静默失败不影响游戏。 */
  let fullscreenKicked = false;
  function kickFullscreenOnce(){
    if(fullscreenKicked) return;
    fullscreenKicked = true;
    if(document.fullscreenElement) return;
    const el = document.getElementById('wrap');
    if(!el) return;
    try {
      if(el.requestFullscreen) el.requestFullscreen().catch(()=>{});
      else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch(e){}
  }

  /* 移动端：点击图例浮层以外的任意位置，自动收起图例。
     capture 阶段拦截，先于画布 pointerdown 执行；点 📖 按钮时跳过，由按钮自己 toggle。 */
  document.addEventListener('pointerdown', (e) => {
    const lg = document.getElementById('legend');
    if(!lg || !lg.classList.contains('show')) return;
    if(!window.matchMedia('(max-width:1000px), (orientation:landscape) and (max-height:560px)').matches) return;
    if(lg.contains(e.target)) return;
    if(e.target && e.target.id === 'btnLegend') return;
    lg.classList.remove('show');
  }, true);

  /* ===================== 初始化 ===================== */
  function init(){
    resizeCanvas();
    buildStars();
    buildLegend();
    /* 移动端初始收起图例浮层，避免一进游戏就盖住画面；
       桌面端保留常驻侧栏。 */
    if(window.matchMedia('(max-width:1000px), (orientation:landscape) and (max-height:560px)').matches){
      const lg = document.getElementById('legend');
      if(lg) lg.classList.remove('show');
    }
    /* 图例默认展开：桌面常驻侧栏，移动端浮层；点击空白处自动收起 */
    resetGame();
    updateHUD();
    /* 窗口尺寸变化（含横竖屏切换、侧栏宽度变化）时重算画布，用 rAF 合并高频 resize */
    let resizeRaf = 0;
    window.addEventListener('resize', () => {
      if(resizeRaf) return;
      resizeRaf = requestAnimationFrame(() => {
        resizeRaf = 0;
        resizeCanvas();
      });
    });
    requestAnimationFrame(loop);
  }

  init();
})();
</script>
</body>
</html>
