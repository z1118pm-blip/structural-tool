

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>裂缝查阅工具 · 全量图文版</title>
<style>
  :root{
    --red:#ef4444; --red-bg:rgba(239,68,68,0.15);
    --orange:#f97316; --orange-bg:rgba(249,115,22,0.15);
    --yellow:#fbbf24; --yellow-bg:rgba(251,191,36,0.15);
    --blue:#38bdf8; --blue-bg:rgba(56,189,248,0.15);
    --gray:#94a3b8; --gray-bg:rgba(148,163,184,0.15);
    --text:#cbd5e1; --muted:#94a3b8; --line:#1e293b; --bg:#05080f;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);line-height:1.6;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  header{position:sticky;top:0;z-index:20;background:#0a101c;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
  header h1{font-size:16px;margin:0;white-space:nowrap;color:#f8fafc;display:flex;align-items:center;gap:8px;letter-spacing:0.5px;}
  header h1::before { content: '◆'; color:var(--blue); font-size:12px; }
  .search{flex:1;min-width:200px;max-width:360px;padding:7px 12px;border:1px solid #334155;background:#111a2c;color:#f8fafc;border-radius:6px;font-size:13.5px;outline:none;transition:all 0.2s;}
  .search:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(56,189,248,.15)}
  .search::placeholder{color:#64748b;}
  .risk-filters{display:flex;gap:10px;flex-wrap:wrap;margin-left: auto;}
  .risk-btn{
    font-size:12.5px;padding:6px 14px;border-radius:6px;
    border:1px solid rgba(148,163,184,0.15);background:#111a2c;
    cursor:pointer;white-space:nowrap;color:#94a3b8;
    transition:all 0.2s;
    display:flex;align-items:center;gap:6px;
  }
  .risk-btn:hover{
    background:rgba(30,41,59,1);transform:translateY(-1px);
    border-color:rgba(148,163,184,0.5);color:#f8fafc;
  }
  
  /* 鼠标悬浮时的颜色微调 */
  .risk-btn[data-risk="red"]:hover { color: var(--red); border-color: var(--red); box-shadow: 0 0 10px rgba(239,68,68,0.2); }
  .risk-btn[data-risk="orange"]:hover { color: var(--orange); border-color: var(--orange); box-shadow: 0 0 10px rgba(249,115,22,0.2); }
  .risk-btn[data-risk="yellow"]:hover { color: var(--yellow); border-color: var(--yellow); box-shadow: 0 0 10px rgba(251,191,36,0.2); }
  .risk-btn[data-risk="blue"]:hover { color: var(--blue); border-color: var(--blue); box-shadow: 0 0 10px rgba(56,189,248,0.2); }
  .risk-btn[data-risk="gray"]:hover { color: var(--gray); border-color: var(--gray); box-shadow: 0 0 10px rgba(148,163,184,0.2); }
  .risk-btn[data-risk="theory"]:hover { color: #a855f7; border-color: #a855f7; box-shadow: 0 0 10px rgba(168,85,247,0.2); }

  /* 选中状态的基础设置 */
  .risk-btn.active { font-weight: 600; transform: none; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }

  /* 不同按钮被选中时的专属颜色 */
  .risk-btn[data-risk="all"].active { background: rgba(56,189,248,0.15); color: var(--blue); border-color: var(--blue); box-shadow: 0 0 12px rgba(56,189,248,0.3); }
  .risk-btn[data-risk="red"].active { background: rgba(239,68,68,0.15); color: #f87171; border-color: var(--red); box-shadow: 0 0 12px rgba(239,68,68,0.3); }
  .risk-btn[data-risk="orange"].active { background: rgba(249,115,22,0.15); color: #fb923c; border-color: var(--orange); box-shadow: 0 0 12px rgba(249,115,22,0.3); }
  .risk-btn[data-risk="yellow"].active { background: rgba(251,191,36,0.15); color: #fcd34d; border-color: var(--yellow); box-shadow: 0 0 12px rgba(251,191,36,0.3); }
  .risk-btn[data-risk="blue"].active { background: rgba(56,189,248,0.15); color: #7dd3fc; border-color: var(--blue); box-shadow: 0 0 12px rgba(56,189,248,0.3); }
  .risk-btn[data-risk="gray"].active { background: rgba(148,163,184,0.15); color: #cbd5e1; border-color: var(--gray); box-shadow: 0 0 12px rgba(148,163,184,0.3); }
  .risk-btn[data-risk="theory"].active { background: rgba(168,85,247,0.15); color: #c084fc; border-color: #a855f7; box-shadow: 0 0 12px rgba(168,85,247,0.3); }

  /* 风险筛选按钮前面的小圆点 */
  .risk-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
    box-shadow: 0 0 6px currentColor;
  }
  
  /* 根据按钮的 data-risk 自动给圆点上色 */
  .risk-btn[data-risk="red"] .risk-dot { background-color: var(--red); color: var(--red); }
  .risk-btn[data-risk="orange"] .risk-dot { background-color: var(--orange); color: var(--orange); }
  .risk-btn[data-risk="yellow"] .risk-dot { background-color: var(--yellow); color: var(--yellow); }
  .risk-btn[data-risk="blue"] .risk-dot { background-color: var(--blue); color: var(--blue); }
  .risk-btn[data-risk="gray"] .risk-dot { background-color: var(--gray); color: var(--gray); }
  .risk-btn[data-risk="theory"] .risk-dot { background-color: #a855f7; color: #a855f7; }
  .app{display:flex;flex:1;min-height:0}
  aside{width:380px;flex:0 0 380px;overflow-y:auto;background:#0d121c;border-right:1px solid var(--line);padding:10px 12px 24px;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.15) transparent;}
  .detail-panel{flex:1;min-width:0;overflow-y:auto;background:#0d121c;scrollbar-width:thin;scrollbar-color:rgba(148,163,184,.15) transparent;}
  
  aside::-webkit-scrollbar, main::-webkit-scrollbar {width:6px;height:6px}
  aside::-webkit-scrollbar-track, main::-webkit-scrollbar-track {background:transparent}
  aside::-webkit-scrollbar-thumb, main::-webkit-scrollbar-thumb {background:rgba(148,163,184,.15);border-radius:3px;}
  aside::-webkit-scrollbar-thumb:hover, main::-webkit-scrollbar-thumb:hover {background:rgba(148,163,184,.4);}
  
  .tree-group{margin:4px 0}
  .tree-group summary{cursor:pointer;font-weight:600;padding:6px 8px;border-radius:6px;font-size:13px;outline:none;color:#cbd5e1;list-style:none;}
  .tree-group summary::-webkit-details-marker{display:none;}
  .tree-group summary::before{content:'';display:inline-block;width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid #64748b;transition:transform 0.2s;margin-right:8px;vertical-align:middle;}
  .tree-group[open] summary::before{transform:rotate(90deg);}
  .tree-group summary:hover{background:#1e293b;color:#f8fafc;}
  .tree-group summary:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
  .tree-sub-group{margin-left:12px}
.tree-sub-title{cursor:pointer;font-size:12px;color:#94a3b8;padding:6px 8px;border-radius:6px;list-style:none;user-select:none;display:flex;align-items:center;transition:all 0.15s;}
.tree-sub-title::-webkit-details-marker{display:none}
.tree-sub-title::before{content:'';display:inline-block;width:0;height:0;border-top:3px solid transparent;border-bottom:3px solid transparent;border-left:4px solid #64748b;transition:transform 0.2s;margin-right:8px;vertical-align:middle;}
.tree-sub-group[open] .tree-sub-title::before{transform:rotate(90deg)}
.tree-sub-title:hover{background:#1e293b;color:#f8fafc}
.tree-sub-content{margin-left:14px;border-left:1px solid #1e293b;padding-left:8px;padding-top:4px;padding-bottom:4px;}
  .tree-item{display:flex;align-items:flex-start;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px;color:#94a3b8;margin:4px 0;transition:all 0.15s;}
  .tree-item:hover{background:#1e293b;color:#cbd5e1;}
  .tree-item.active{background:rgba(56,189,248,0.1);color:var(--blue);font-weight:600;border-left:2px solid var(--blue);border-radius:0 6px 6px 0;}
  .dot-red{width:6px;height:6px;border-radius:50%;flex:0 0 auto;box-shadow:0 0 6px currentColor;}
  
  .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:4px;font-size:11px;border:1px solid;white-space:nowrap;font-weight:600;letter-spacing:0.5px;}
  .badge-red{background:var(--red-bg);color:#f87171;border-color:rgba(239,68,68,0.3)}
  .badge-orange{background:var(--orange-bg);color:#fb923c;border-color:rgba(249,115,22,0.3)}
  .badge-yellow{background:var(--yellow-bg);color:#fcd34d;border-color:rgba(251,191,36,0.3)}
  .badge-blue{background:var(--blue-bg);color:#7dd3fc;border-color:rgba(56,189,248,0.3)}
  .badge-gray{background:var(--gray-bg);color:#cbd5e1;border-color:rgba(148,163,184,0.3)}
  .badge-theory{background:rgba(168,85,247,0.15);color:#c084fc;border-color:rgba(168,85,247,0.3)}

  /* 卡片样式已移除，合并入树形列表 */
  
  .detail{padding:24px;min-height:100%;display:flex;flex-direction:column;}
  .breadcrumb{font-size:12px;color:#64748b;margin-bottom:8px;}
  .detail h2{font-size:20px;margin:0 0 16px;color:#f8fafc;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .detail-header-btns{display:flex;gap:8px;}
  .empty-detail{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#64748b;font-size:13px;}
  .risk-bar{padding:12px 16px;border-radius:8px;margin:16px 0;border-left:4px solid;font-size:13.5px;color:#cbd5e1;background:#0f172a;}
  .risk-bar.risk-red{border-color:var(--red);background:rgba(239,68,68,0.05)}
  .risk-bar.risk-orange{border-color:var(--orange);background:rgba(249,115,22,0.05)}
  .risk-bar.risk-yellow{border-color:var(--yellow);background:rgba(251,191,36,0.05)}
  .risk-bar.risk-blue{border-color:var(--blue);background:rgba(56,189,248,0.05)}
  .risk-bar.risk-gray{border-color:var(--gray);background:rgba(148,163,184,0.05)}
  .risk-bar.risk-theory{border-color:#a855f7;background:rgba(168,85,247,0.05)}
  
  .image-panel{border:1px solid rgba(148,163,184,0.15);border-radius:10px;padding:16px;background:#0f172a;margin:20px auto; width: fit-content; max-width: 100%;}
  .image-wrap{display:flex;align-items:center;justify-content:center;min-height:120px;position:relative;}
  .image-wrap img{max-width:100%;max-height:75vh;display:block;object-fit:contain; transition: transform 0.2s, filter 0.3s; filter: invert(1) grayscale(1) brightness(0.85) contrast(1.2); mix-blend-mode: screen;}
.image-wrap img:hover { transform: scale(1.02); }
.image-panel.original { background: #f8fafc; border-color: #cbd5e1; }
.image-panel.original { background-color: #f8fafc; border-color: #cbd5e1; }
.image-panel.original .image-wrap img { filter: none; mix-blend-mode: normal; }
  .placeholder{color:#64748b;font-size:13px;padding:20px;font-family:'JetBrains Mono', monospace;}

  dl.fields{display:grid;grid-template-columns:64px 1fr;gap:12px 16px;margin:16px 0;padding:16px;background:#0f172a;border-radius:8px;border:1px solid #1e293b;}
  dl.fields div{display:contents;}
  dl.fields dt{font-weight:600;color:#94a3b8;font-size:13px;padding-top:2px;letter-spacing:0.5px;}
  dl.fields dd{margin:0;font-size:13.5px;color:#e2e8f0;line-height:1.6;}
  
  .processing-mask { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,0.8); display:flex; align-items:center; justify-content:center; font-weight:bold; color:var(--blue); z-index:5; flex-direction:column;}
  .spinner { width:30px; height:30px; border:3px solid rgba(56,189,248,0.2); border-top-color:var(--blue); border-radius:50%; animation:spin 1s linear infinite; margin-bottom:10px;}
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Toast 轻提示样式 */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#f8fafc;padding:10px 24px;border-radius:8px;font-size:14px;border:1px solid #38bdf8;box-shadow:0 10px 15px -3px rgba(0,0,0,0.5);opacity:0;visibility:hidden;transition:all 0.3s cubic-bezier(0.68,-0.55,0.27,1.55);z-index:10000;display:flex;align-items:center;gap:8px;}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}

  #btnBackToList { display: none; }
  @media (max-width: 1024px){
    .app { flex-direction: row; overflow: hidden; position: relative; }
    aside { width: 100%; flex: 1; border-right: none; max-height: none; }
    .detail-panel { display: none; width: 100%; flex: 1; border-left: none; }
    
    /* 当显示详情时，隐藏侧栏，显示详情 */
    .app.show-detail aside { display: none; }
    .app.show-detail .detail-panel { display: block; }
    
    #btnBackToList { display: inline-flex; margin-bottom: 16px; }
  }
</style>
</head>

<header>
  <a href="index.html" style="display:flex; align-items:center; gap:6px; text-decoration:none; color:#cbd5e1; font-size:13px; font-weight:600; padding:6px 14px; border-radius:6px; border:1px solid #334155; background:#0b1220; margin-right:6px; transition:all 0.2s;" onmouseover="this.style.borderColor='#38bdf8'; this.style.color='#38bdf8'" onmouseout="this.style.borderColor='#334155'; this.style.color='#cbd5e1'">

    主工具
  </a>
  <h1>裂缝查阅工具</h1>
  <input id="searchInput" class="search" type="search" placeholder="搜索形态、成因、性质（支持全字段）…">
  <div class="risk-filters" id="riskFilters" role="group" aria-label="按风险等级筛选">

    <button class="risk-btn" data-risk="orange"><span class="risk-dot"></span>橙色 · 及时加固</button>
    <button class="risk-btn" data-risk="yellow"><span class="risk-dot"></span>黄色 · 观察</button>
    <button class="risk-btn" data-risk="blue"><span class="risk-dot"></span>蓝色 · 封闭掩饰</button>
    <button class="risk-btn" data-risk="gray"><span class="risk-dot"></span>灰色 · 表层</button>
    <button class="risk-btn" data-risk="theory"><span class="risk-dot"></span>紫色 · 理论图鉴</button>
  </div>
</header>

<div class="app" id="appContainer">
  <aside id="sidebar"></aside>
  <div id="detailPanel" class="detail-panel"></div>
</div>

const RISK = {
  red:    { label: "红色 · 立即处理", badge: "badge-red",    bar: "risk-red",    color: "#ef4444" },
  orange: { label: "橙色 · 及时加固", badge: "badge-orange", bar: "risk-orange", color: "#f97316" },
  yellow: { label: "黄色 · 观察",     badge: "badge-yellow", bar: "risk-yellow", color: "#fbbf24" },
  blue:   { label: "蓝色 · 封闭掩饰", badge: "badge-blue",   bar: "risk-blue",   color: "#38bdf8" },
  gray:   { label: "灰色 · 表层",     badge: "badge-gray",   bar: "risk-gray",   color: "#94a3b8" },
  theory: { label: "紫色 · 理论图鉴", badge: "badge-theory", bar: "risk-theory", color: "#a855f7" },
  unknown:{ label: "未知 · 待确认",   badge: "badge-gray",   bar: "risk-gray",   color: "#94a3b8" }
};

const state = { risk: "all", q: "", selectedId: null, openCategory: null, openSubcategories: new Set(), listScrollTop: 0 };
const sidebarEl = document.getElementById("sidebar");

// 中间列表已移除
const detailEl = document.getElementById("detailPanel");
const searchInput = document.getElementById("searchInput");

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[ch]));
}

function normalizeRisk(risk) {
  return Object.prototype.hasOwnProperty.call(RISK, risk) ? risk : "unknown";
}
function riskInfo(risk) {
  return RISK[normalizeRisk(risk)];
}

function matches(crack) {
  if (state.risk !== "all" && normalizeRisk(crack.risk) !== state.risk) return false;
  const q = state.q.trim().toLowerCase();
  if (!q) return true;
  return [
    crack.id, crack.category, crack.subcategory, crack.itemNo, crack.title,
    crack.path, crack.morphology, crack.cause, crack.nature, crack.impact,
    crack.treatment, crack.risk, riskInfo(crack.risk).label
  ].join(" ").toLowerCase().includes(q);
}

function filtered() {
  return CRACKS.filter(matches);
}

// ========== 渲染左侧侧边栏 ==========
function renderSidebar() {
  const prevScroll = sidebarEl.scrollTop;
  const list = filtered();
  const groups = new Map();

  list.forEach(crack => {
    if (!groups.has(crack.category)) groups.set(crack.category, new Map());
    const subs = groups.get(crack.category);
    if (!subs.has(crack.subcategory)) subs.set(crack.subcategory, []);
    subs.get(crack.subcategory).push(crack);
  });

  let html = "";
  if (!list.length) {
    html = '<div class="placeholder">没有匹配的裂缝条目</div>';
  }

  const isSearching = !!state.q.trim();

  for (const [category, subs] of groups) {
    const count = [...subs.values()].reduce((n, arr) => n + arr.length, 0);
    const isCatOpen = (state.openCategory === category || isSearching) ? ' open' : '';
    
    html += `
      <details class="tree-group" data-cat="${escapeHtml(category)}"${isCatOpen}>
        <summary>${escapeHtml(category)}
          <span style="color:#5f6b7a;font-weight:400;font-size:12px">(${count})</span>
        </summary>
    `;

    for (const [subcategory, items] of subs) {
      const isSubOpen = ((state.openSubcategories.has(subcategory) && state.openCategory === category) || isSearching) ? ' open' : '';
      
      html += `
        <details class="tree-sub-group" data-sub="${escapeHtml(subcategory)}"${isSubOpen}>
          <summary class="tree-sub-title">${escapeHtml(subcategory)}</summary>
          <div class="tree-sub-content">
      `;
      items.forEach(crack => {
        const ri = riskInfo(crack.risk);
        html += `
          <div class="tree-item ${crack.id === state.selectedId ? "active" : ""}" data-id="${escapeHtml(crack.id)}" role="button" tabindex="0">
            <span class="dot-red" style="margin-top:6px; background:${ri.color};color:${ri.color}"></span>
            <div style="flex:1; min-width:0;">
              <div style="font-weight:600; color:#cbd5e1; margin-bottom:2px;">${escapeHtml(crack.itemNo)} ${escapeHtml(crack.title)}</div>
              <div style="font-size:12px; color:#64748b; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">形态：${escapeHtml(crack.morphology)}</div>
            </div>
          </div>
        `;
      });
      html += `</div></details>`;
    }
    html += `</details>`;
  }

  sidebarEl.innerHTML = html;
  sidebarEl.scrollTop = prevScroll;

  const catEls = sidebarEl.querySelectorAll(".tree-group");
  catEls.forEach(details => {
    details.addEventListener('toggle', (e) => {
      if (isSearching) return;
      if (details.open) {
        state.openCategory = details.dataset.cat;
        catEls.forEach(other => { if (other !== details) other.removeAttribute('open'); });
      } else if (state.openCategory === details.dataset.cat) {
        state.openCategory = null;
      }
    });
  });

  const subEls = sidebarEl.querySelectorAll(".tree-sub-group");
  subEls.forEach(details => {
    details.addEventListener('toggle', (e) => {
      if (isSearching) return;
      if (details.open) state.openSubcategories.add(details.dataset.sub);
      else state.openSubcategories.delete(details.dataset.sub);
    });
  });

  sidebarEl.querySelectorAll(".tree-item").forEach(el => {
    el.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); el.click(); }
    });
    el.addEventListener("click", () => {
      selectCrack(el.dataset.id);
    });
  });

  // 确保侧栏选中项在可视区域内
  const activeTreeItem = sidebarEl.querySelector(".tree-item.active");
  if (activeTreeItem) {
    const itemRect = activeTreeItem.getBoundingClientRect();
    const sidebarRect = sidebarEl.getBoundingClientRect();
    if (itemRect.top < sidebarRect.top || itemRect.bottom > sidebarRect.bottom) {
      activeTreeItem.scrollIntoView({ block: "nearest" });
    }
  }
}

        <div><dt>处理方法</dt><dd>${escapeHtml(crack.treatment)}</dd></div>
      </dl>
    </div>
  `;

  // 绑定返回列表按钮
  const btnBack = document.getElementById("btnBackToList");
  if (btnBack) {
    btnBack.addEventListener("click", () => {
      document.getElementById("appContainer").classList.remove("show-detail");
      // 可选：把焦点还给左侧侧边栏的当前激活项

      if (activeTree) activeTree.focus({ preventScroll: true });

    try {
      if (!navigator.clipboard || typeof navigator.clipboard.writeText !== "function") {

    detailEl.dataset.lastId = crack.id;
  }

// ========== 联动核心逻辑 ==========
function selectCrack(id) {
  const ae = document.activeElement;
  const focusSource = ae && ae.closest && ae.closest("#sidebar .tree-item") ? "sidebar" : null;

  state.selectedId = id;
  const crack = CRACKS.find(c => c.id === id);
  if (crack) {
    state.openCategory = crack.category;
    state.openSubcategories.add(crack.subcategory);
  }
  
  // 局部刷新
  renderSidebar(); // 刷新侧栏的选中高亮
  
  // 重绘后把焦点恢复到新的选中项（如果是键盘操作）
  if (focusSource === "sidebar") {
    const activeTree = sidebarEl.querySelector(".tree-item.active");
    if (activeTree) activeTree.focus({ preventScroll: true });
  }

  renderDetail();  // 刷新右侧详情
  
  // 移动端：加上 show-detail 类，覆盖全屏显示详情
  if (window.matchMedia("(max-width: 1024px)").matches) {
    document.getElementById("appContainer").classList.add("show-detail");
    document.getElementById("detailPanel").scrollTop = 0;
  }
}

function render() {
  renderSidebar();
  renderDetail();
  // 搜索或全局刷新时，如果在移动端，确保退回列表状态
  if (window.matchMedia("(max-width: 1024px)").matches && !state.selectedId) {
    document.getElementById("appContainer").classList.remove("show-detail");
  }
}

// 绑定风险筛选
const riskBtns = document.querySelectorAll("#riskFilters .risk-btn");
riskBtns.forEach(btn => {
  btn.setAttribute("aria-pressed", btn.classList.contains("active") ? "true" : "false");
});
riskBtns.forEach(btn => {
  btn.addEventListener("click", () => {
    state.risk = btn.dataset.risk;
    // 切换筛选时，如果当前选中的不符合筛选条件，则清空选中
    const sel = CRACKS.find(c => c.id === state.selectedId);
    if (sel && !matches(sel)) state.selectedId = null;

    riskBtns.forEach(b => {
      b.classList.toggle("active", b === btn);
      b.setAttribute("aria-pressed", b === btn ? "true" : "false");
    });
    render();
  });
});

// 绑定搜索
searchInput.addEventListener("input", e => {
  state.q = e.target.value;
  const sel = CRACKS.find(c => c.id === state.selectedId);
  if (sel && !matches(sel)) state.selectedId = null;
  render();
});

// 绑定键盘上下键切换
document.addEventListener("keydown", (e) => {
  const lb = document.getElementById('lightbox');
  const lbOpen = lb && lb.style.display !== 'none';
  if (lbOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closeLightbox(); return; }
    if (e.key === 'Tab') {
      e.preventDefault();
      const closeBtn = document.getElementById('lightbox-close');
      if (closeBtn) closeBtn.focus();
      return;
    }
    if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', '/'].includes(e.key)) {
      e.preventDefault();
    }
    return;
  }
  if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) {
    e.preventDefault();
    searchInput.focus();
    return;
  }
  if (['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const list = filtered();
    if (!list.length) return;
    
    let currentIndex = list.findIndex(c => c.id === state.selectedId);
    if (e.key === 'ArrowDown') currentIndex = currentIndex < list.length - 1 ? currentIndex + 1 : 0;
    if (e.key === 'ArrowUp') currentIndex = currentIndex > 0 ? currentIndex - 1 : list.length - 1;
    
    if (currentIndex === -1) currentIndex = 0; // 如果没有选中，则默认选第一个
    selectCrack(list[currentIndex].id);
  }
});

// 初始启动
state.selectedId = null;
render();
</script>

<!-- 图片灯箱结构 -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="图片预览" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:9999; justify-content:center; align-items:center; cursor:zoom-out;" onclick="if(event.target===this) closeLightbox()">
  <button id="lightbox-close" type="button" aria-label="关闭图片预览" style="position:absolute; top:20px; right:24px; width:40px; height:40px; border-radius:50%; border:1px solid #475569; background:#1e293b; color:#f8fafc; font-size:22px; line-height:1; cursor:pointer; z-index:2;">×</button>
  <img id="lightbox-img" src="" alt="预览大图" style="max-width:95%; max-height:95%; object-fit:contain; background:#fff; border-radius:8px; padding:10px;">
</div>

<!-- Toast 容器 -->
<div id="globalToast" class="toast" role="status" aria-live="polite" aria-atomic="true">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
  <span id="toastText">复制成功</span>
</div>

<script>
let lightboxReturnFocus = null;
function openLightbox(src) {
  const lb = document.getElementById('lightbox');
  const lbImg = document.getElementById('lightbox-img');
  lightboxReturnFocus = document.activeElement;
  lbImg.src = src;
  lb.style.display = 'flex';
  const closeBtn = document.getElementById('lightbox-close');
  if (closeBtn) closeBtn.focus();
}
function closeLightbox() {
  const lb = document.getElementById('lightbox');
  if (!lb || lb.style.display === 'none') return;
  lb.style.display = 'none';
  document.getElementById('lightbox-img').src = '';
  if (lightboxReturnFocus && typeof lightboxReturnFocus.focus === 'function') {
    lightboxReturnFocus.focus();
  }
  lightboxReturnFocus = null;
}

document.getElementById('lightbox-close').addEventListener('click', (e) => {
  e.stopPropagation();
  closeLightbox();
});

// 全局 Toast 提示函数
function showToast(msg) {
  const toast = document.getElementById('globalToast');
  const toastText = document.getElementById('toastText');
  toastText.textContent = msg;
  toast.classList.add('show');
  
  if(window.toastTimer) clearTimeout(window.toastTimer);
  
  window.toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2000);
}
</script>
</body>
</html>
