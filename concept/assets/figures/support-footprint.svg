<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 600" role="img" aria-labelledby="supportTitle supportDesc">
<title id="supportTitle">从建筑总荷载到单柱受荷面积</title><desc id="supportDesc">左侧由层数和每层全部恒载与活载求总荷载，右侧按柱网受荷面积区分角柱、边柱和中柱。</desc>
