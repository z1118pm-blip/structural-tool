<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="torsionTitle torsionDesc">
<title id="torsionTitle">水平作用与基底抗力不共线时产生整体扭转</title><desc id="torsionDesc">左侧立面为 L 形的建筑实体居中落在基础范围内，建筑本体默认整体旋转 180°，水平地震合力作用于悬挑段中点；底部接触截面固定，上部可相对扭转。右侧水平投影中，水平力与基底抗力平行反向。</desc>
<defs>
  <marker id="torsionArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#b45336"/></marker>
  <marker id="torsionReactionArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#3f6c62"/></marker>
  <marker id="torsionDimensionArrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0 7 3.5 0 7Z" fill="#6f726b"/></marker>
</defs>
<rect width="1200" height="700" fill="#fdfcf9"/>
<path d="M50 435 430 645 700 460 330 260Z" fill="#f2f0e9" stroke="#242522" stroke-width="2.4" stroke-linejoin="round"/>
<g class="torsion-reference"></g>
<g class="torsion-solid" stroke="#242522" stroke-width="2.7" stroke-linejoin="round">
  <path d="M375 155 265 215 370 270 480 210Z" fill="#fdfcf9"/>
  <path d="M480 210 370 270 370 520 480 460Z" fill="#e6e4dc"/>
  <path d="M265 215 155 275 260 330 370 270Z" fill="#fdfcf9"/>
  <path d="M370 270 260 330 260 425 370 365Z" fill="#e6e4dc"/>
  <path d="M155 275 260 330 260 425 155 365Z" fill="#f7f5ef"/>
  <path d="M265 305 155 365 260 425 370 365Z" fill="#d8d6ce"/>
  <path d="M265 305 370 365 370 520 265 465Z" fill="#f7f5ef"/>
</g>
<path class="torsion-e-dimension-3d" d="M379.7 235.5L468.5 413.3" fill="none" stroke="#6f726b" stroke-width="1.8" marker-start="url(#torsionDimensionArrow)" marker-end="url(#torsionDimensionArrow)"/>
<path class="torsion-right-angle-3d" d="M394 228.35L401.15 242.65L386.85 249.8" fill="none" stroke="#242522" stroke-width="1.6"/>
<g class="torsion-force" fill="none" stroke-width="3.4">
  <path d="M379.7 235.5L308.4 199.8" stroke="#b45336" marker-end="url(#torsionArrow)"/>
  <path class="torsion-r-3d" d="M460 502.5L385 465" stroke="#3f6c62" marker-end="url(#torsionReactionArrow)"/>
</g>
<path class="torsion-moment" d="M345 105C385 60 465 65 475 115" fill="none" stroke="#b45336" stroke-width="3" marker-end="url(#torsionArrow)"/>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text class="torsion-h-label-3d" x="354.7" y="215.5" font-size="24" font-weight="700" fill="#b45336">H</text><text class="torsion-r-label-3d" x="468" y="524.5" font-size="24" font-weight="700" fill="#3f6c62">R</text><text class="torsion-e-label-3d" x="390.1" y="312.4" font-size="23" font-weight="700" fill="#242522">e</text></g>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="765" y="105" font-size="22" font-weight="700" fill="#242522">水平投影中的偏心距</text><text x="765" y="137" font-size="16" fill="#6f726b">H 与 R 平行反向，e 与两力线垂直</text><text x="765" y="169" font-size="16" fill="#6f726b">H 为悬挑段水平地震作用的投影</text></g>
<rect class="torsion-plan-outline" x="826.5" y="286.5" width="198" height="147" fill="#f7f5ef" stroke="#242522" stroke-width="2"/>
<path class="torsion-plan-hidden" d="M925.5 286.5V433.5" fill="none" stroke="#6f726b" stroke-width="1.6" stroke-dasharray="7 6"/>
<g fill="none" stroke="#6f726b" stroke-width="1.7" stroke-dasharray="6 6"><path class="torsion-h-guide" d="M800 327.1875H1080"/><path class="torsion-r-guide" d="M800 360H1080"/></g>
<g fill="none" stroke-width="3.5"><path class="torsion-plan-h" d="M826.5 327.1875H950" stroke="#b45336" marker-end="url(#torsionArrow)"/><path class="torsion-plan-r" d="M1050 360H975" stroke="#3f6c62" marker-end="url(#torsionReactionArrow)"/></g>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" font-weight="700"><text class="torsion-plan-h-label" x="800" y="317.1875" fill="#b45336">H</text><text class="torsion-plan-r-label" x="1005" y="395" fill="#3f6c62">R</text></g>
<path class="torsion-e-dimension" d="M1080 327.1875V360" fill="none" stroke="#6f726b" stroke-width="1.8" marker-start="url(#torsionDimensionArrow)" marker-end="url(#torsionDimensionArrow)"/>
<g class="torsion-right-angle" fill="none" stroke="#242522" stroke-width="1.8"><path d="M1062 327.1875V345.1875H1080"/><path d="M1062 360V342H1080"/></g>
<text class="torsion-e-label" x="1095" y="355" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="700" fill="#242522">e＝2.5 m</text>
<g font-family="PingFang SC,Microsoft YaHei,sans-serif"><text x="805" y="555" font-size="23" font-weight="700" fill="#b45336">T＝H×e</text><text class="torsion-moment-note" x="805" y="590" font-size="17" fill="#6f726b">力与抗力不共线，形成扭矩</text></g>
</svg>
